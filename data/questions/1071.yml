# 令和6年度 ITパスポート 公開問題 問91
id: 1071
type: single_choice
text: |
  職場で不要になったPCを廃棄する場合の情報漏えい対策として、最も適切なものはどれか。
choices:
  - "OSが用意しているファイル削除の機能を使って、PC内のデータファイルを全て削除する。"
  - "PCにインストールされているアプリケーションを、全てアンインストールする。"
  - "PCに内蔵されている全ての記憶装置を論理フォーマットする。"
  - "専用ソフトなどを使って、PCに内蔵されている全ての記憶装置の内容を消去するために、ランダムなデータを規定回数だけ上書きする。"
correct: 3
explanation: |
  通常のファイル削除や論理フォーマットでは、記憶領域にデータが残り復元される可能性があります。専用ソフトで規定回数ランダムデータを上書きすれば、元のデータを復元困難にできます。

  「OSが用意しているファイル削除の機能を使って、PC内のデータファイルを全て削除する。」は、通常のファイル削除では管理情報が消えるだけで、データ本体を復元できる場合があります。
  「PCにインストールされているアプリケーションを、全てアンインストールする。」は、アプリケーションを削除しても、利用者が保存したデータは消去されません。
  「PCに内蔵されている全ての記憶装置を論理フォーマットする。」は、論理フォーマットだけでは記憶領域のデータが残り、復元される可能性があります。
  「専用ソフトなどを使って、PCに内蔵されている全ての記憶装置の内容を消去するために、ランダムなデータを規定回数だけ上書きする。」が正しいです。記憶領域へランダムデータを規定回数上書きして復元を困難にします。
