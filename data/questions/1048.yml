# 令和6年度 ITパスポート 公開問題 問68
id: 1048
type: single_choice
text: |
  情報デザインで用いられる概念であり、部屋のドアノブの形で開閉の仕方を示唆するというような、人間の適切な行動を誘発する知覚可能な手掛かりのことを何と呼ぶか。
choices:
  - "NUI (Natural User Interface)"
  - "ウィザード"
  - "シグニファイア"
  - "マルチタッチ"
correct: 2
explanation: |
  シグニファイアは、形状、表示、配置などによって利用者に可能な操作を知覚させ、適切な行動を促す手掛かりです。ドアノブの形から回す・押すといった操作が分かることが例です。

  ア：NUIは、音声や身振りなど人の自然な動作で操作するインタフェースです。
  イ：ウィザードは、対話形式で利用者を複数の設定手順へ案内する機能です。
  ウ：正しいです。形状や表示によって可能な操作を知覚させる手掛かりです。
  エ：マルチタッチは、複数の指の接触を同時に検出する操作方式です。
