# 令和6年度 ITパスポート 公開問題 問46
id: 1026
type: single_choice
text: |
  ITサービスマネジメントの管理プロセスに関する記述a〜cと用語の適切な組合せはどれか。
  
  a ITサービスの変更を実装するためのプロセス
  b インシデントの根本原因を突き止めて解決策を提供するためのプロセス
  c 組織が所有しているIT資産を把握するためのプロセス
choices:
  - "a:構成管理, b:問題管理, c:リリース及び展開管理"
  - "a:構成管理, b:リリース及び展開管理, c:問題管理"
  - "a:問題管理, b:リリース及び展開管理, c:構成管理"
  - "a:リリース及び展開管理, b:問題管理, c:構成管理"
correct: 3
explanation: |
  変更を実装して利用可能にするのはリリース及び展開管理、インシデントの根本原因を解明するのは問題管理、IT資産やその関係を把握するのは構成管理です。

  ア：aとcが逆です。変更の実装はリリース及び展開管理、資産把握は構成管理です。
  イ：三つの対応がずれており、根本原因の解明は問題管理です。
  ウ：aとbが逆です。変更の実装はリリース及び展開管理です。
  エ：正しいです。aはリリース及び展開管理、bは問題管理、cは構成管理です。
