# 令和6年度 ITパスポート 公開問題 問2
id: 982
type: single_choice
text: |
  情報システムに不正に侵入し、サービスを停止させて社会的混乱を生じさせるような行為に対して、国全体で体系的に防御施策を講じるための基本理念を定め、国の責務などを明らかにした法律はどれか。
choices:
  - "公益通報者保護法"
  - "サイバーセキュリティ基本法"
  - "不正アクセス禁止法"
  - "プロバイダ責任制限法"
correct: 1
explanation: |
  サイバーセキュリティ基本法は、サイバーセキュリティ施策の基本理念を定め、国や地方公共団体などの責務を明らかにした法律です。不正アクセス禁止法は個々の不正アクセス行為などを規制する法律であり、国全体の基本理念を定める法律ではありません。

  ア：公益通報を理由とする解雇などの不利益な取扱いから通報者を保護する法律です。
  イ：正しいです。国全体のサイバーセキュリティ施策の基本理念と責務を定めています。
  ウ：他人のID・パスワードを悪用した不正アクセスなどを規制する法律です。
  エ：インターネット上の権利侵害について、プロバイダの責任範囲や発信者情報開示を定める法律です。
