# 令和6年度 ITパスポート 公開問題 問31
id: 1011
type: single_choice
text: |
  顧客との個々のつながりを意識して情報を頻繁に更新するSNSなどのシステムとは異なり、会計システムのように高い信頼性と安定稼働が要求される社内情報を扱うシステムの概念を示す用語として、最も適切なものはどれか。
choices:
  - "IoT (Internet of Things)"
  - "PoC (Proof of Concept)"
  - "SoE (Systems of Engagement)"
  - "SoR (Systems of Record)"
correct: 3
explanation: |
  SoR（Systems of Record）は、会計や人事などの記録を正確かつ安定的に管理するシステムです。顧客とのつながりや頻繁な情報更新を重視するシステムはSoEと呼ばれます。

  「IoT (Internet of Things)」は、IoTは、さまざまな物をネットワークへ接続して情報交換する仕組みです。
  「PoC (Proof of Concept)」は、PoCは、新しい技術やアイデアの実現可能性を検証することです。
  「SoE (Systems of Engagement)」は、SoEは、顧客との関係や交流を重視し、頻繁に変化する情報を扱うシステムです。
  「SoR (Systems of Record)」が正しいです。SoRは会計などの記録を正確かつ安定的に管理するシステムです。
