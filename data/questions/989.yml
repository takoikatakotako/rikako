# 令和6年度 ITパスポート 公開問題 問9
id: 989
type: single_choice
text: |
  企業の戦略立案やマーケティングなどで使用されるフェルミ推定に関する記述として、最も適切なものはどれか。
choices:
  - "正確に算出することが極めて難しい数量に対して、把握している情報と論理的な思考プロセスによって概数を求める手法である。"
  - "特定の集団と活動を共にしたり、人々の動きを観察したりすることによって、習慣や嗜好、地域や組織を取り巻く文化を視察する手法である。"
  - "入力データと出力データから、その因果関係を統計的に推定する手法である。"
  - "有識者のグループに繰り返し同一のアンケート調査とその結果のフィードバックを行うことによって、ある分野の将来予測に関する総意を得る手法である。"
correct: 0
explanation: |
  フェルミ推定は、正確な把握が難しい数量を、既知の情報と合理的な仮定に分解して概算する手法です。有識者への反復アンケートで将来予測の合意を形成する手法はデルファイ法です。

  「正確に算出することが極めて難しい数量に対して、把握している情報と論理的な思考プロセスによって概数を求める手法である。」が正しいです。限られた情報を分解し、合理的な仮定から概数を求めるフェルミ推定の説明です。
  「特定の集団と活動を共にしたり、人々の動きを観察したりすることによって、習慣や嗜好、地域や組織を取り巻く文化を視察する手法である。」は、集団の行動や文化を現場で観察するエスノグラフィの説明です。
  「入力データと出力データから、その因果関係を統計的に推定する手法である。」は、変数間の関係を統計的に求める回帰分析などの説明です。
  「有識者のグループに繰り返し同一のアンケート調査とその結果のフィードバックを行うことによって、ある分野の将来予測に関する総意を得る手法である。」は、専門家への反復調査で将来予測の合意を形成するデルファイ法の説明です。
