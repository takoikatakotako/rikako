# 令和6年度 ITパスポート 公開問題 問92
id: 1072
type: single_choice
text: |
  インターネットに接続しているサーバが、1台でメール送受信機能とWebアクセス機能の両方を提供しているとき、端末のアプリケーションプログラムがそのどちらの機能を利用するかをサーバに指定するために用いるものはどれか。
choices:
  - "IPアドレス"
  - "ドメイン"
  - "ポート番号"
  - "ホスト名"
correct: 2
explanation: |
  IPアドレスやホスト名はサーバを識別し、ポート番号はそのサーバ上のどの通信サービスを利用するかを識別します。同じサーバのメールとWebを区別するにはポート番号を使います。

  ア：IPアドレスは通信相手の機器を識別しますが、同じ機器上のサービスを区別しません。
  イ：ドメイン名は機器やネットワークを識別する名前で、サービスの種類を区別しません。
  ウ：正しいです。ポート番号によって同じサーバ上のメールやWebなどのサービスを区別します。
  エ：ホスト名はネットワーク上の機器を識別する名前で、サービスの種類を区別しません。
