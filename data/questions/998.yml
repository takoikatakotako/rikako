# 令和6年度 ITパスポート 公開問題 問18
id: 998
type: single_choice
text: |
  コーポレートガバナンスを強化した事例として、最も適切なものはどれか。
choices:
  - "女性が活躍しやすくするために労務制度を拡充した。"
  - "迅速な事業展開のために、他社の事業を買収した。"
  - "独立性の高い社外取締役の人数を増やした。"
  - "利益が得られにくい事業から撤退した。"
correct: 2
explanation: |
  コーポレートガバナンスは、経営を監督し、企業活動の健全性や透明性を確保する仕組みです。独立性の高い社外取締役を増やすことは、経営陣への監督機能の強化につながります。

  「女性が活躍しやすくするために労務制度を拡充した。」は、女性活躍を支える人事・労務施策であり、経営監督機能の強化を直接示すものではありません。
  「迅速な事業展開のために、他社の事業を買収した。」は、他社事業の買収はM&Aによる事業戦略であり、ガバナンス強化とは限りません。
  「独立性の高い社外取締役の人数を増やした。」が正しいです。独立した社外取締役は経営陣を客観的に監督します。
  「利益が得られにくい事業から撤退した。」は、不採算事業からの撤退は事業ポートフォリオの見直しです。
