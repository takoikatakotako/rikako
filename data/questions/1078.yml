# 令和6年度 ITパスポート 公開問題 問98
id: 1078
type: single_choice
text: |
  ランサムウェアに関する記述として、最も適切なものはどれか。
choices:
  - "PCに外部から不正にログインするための侵入路をひそかに設置する。"
  - "PCのファイルを勝手に暗号化し、復号のためのキーを提供することなどを条件に金銭を要求する。"
  - "Webブラウザを乗っ取り、オンラインバンキングなどの通信に割り込んで不正送金などを行う。"
  - "自らネットワークを経由して感染を広げる機能をもち、まん延していく。"
correct: 1
explanation: |
  ランサムウェアは、端末のファイルを暗号化するなどして利用不能にし、復旧や復号と引き換えに身代金を要求するマルウェアです。自らネットワーク感染を広げる性質を中心とするものはワームです。

  ア：侵入用の裏口を設ける動作はバックドアに関する説明です。
  イ：正しいです。ファイルを暗号化するなどして復旧と引き換えに身代金を要求します。
  ウ：ブラウザ通信へ割り込んで不正送金する動作はMITB攻撃などの説明です。
  エ：自らネットワーク経由で感染を広げるマルウェアはワームです。
