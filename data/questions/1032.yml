# 令和6年度 ITパスポート 公開問題 問52
id: 1032
type: single_choice
text: |
  システム開発プロジェクトにおいて、新機能の追加要求が変更管理委員会で認可された後にプロジェクトスコープマネジメントで実施する活動として、適切なものはどれか。
choices:
  - "新機能を追加で開発するためにWBSを変更し、コストの詳細な見積りをするための情報として提供する。"
  - "新機能を追加で開発するためのWBSのアクティビティの実行に必要なスキルを確認し、必要に応じてプロジェクトチームの能力向上を図る。"
  - "変更されたWBSに基づいてスケジュールを作成し、完了時期の見通しを提示する。"
  - "変更されたWBSに基づいて要員の充足度を確認し、必要な場合は作業の外注を検討する。"
correct: 0
explanation: |
  プロジェクトスコープマネジメントでは、承認された追加要求を成果物と作業範囲に反映するためWBSを更新します。更新したWBSは、コストやスケジュールなど他の管理領域の見積りの基礎になります。

  「新機能を追加で開発するためにWBSを変更し、コストの詳細な見積りをするための情報として提供する。」が正しいです。承認された追加機能を作業範囲へ反映するためWBSを変更します。
  「新機能を追加で開発するためのWBSのアクティビティの実行に必要なスキルを確認し、必要に応じてプロジェクトチームの能力向上を図る。」は、必要スキルの確認と能力向上は、資源や人的資源のマネジメントに当たります。
  「変更されたWBSに基づいてスケジュールを作成し、完了時期の見通しを提示する。」は、WBSからスケジュールを作成する活動は、スケジュールマネジメントに当たります。
  「変更されたWBSに基づいて要員の充足度を確認し、必要な場合は作業の外注を検討する。」は、要員の確認や外注検討は、資源や調達のマネジメントに当たります。
