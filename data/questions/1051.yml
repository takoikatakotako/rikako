# 令和6年度 ITパスポート 公開問題 問71
id: 1051
type: single_choice
text: |
  インターネットで使用されているドメイン名の説明として、適切なものはどれか。
choices:
  - "Web閲覧や電子メールを送受信するアプリケーションが使用する通信規約の名前"
  - "コンピュータやネットワークなどを識別するための名前"
  - "通信を行うアプリケーションを識別するための名前"
  - "電子メールの宛先として指定する相手の名前"
correct: 1
explanation: |
  ドメイン名は、インターネット上のコンピュータやネットワークを人が扱いやすい文字列で識別する名前です。DNSによってIPアドレスと対応付けられます。

  「Web閲覧や電子メールを送受信するアプリケーションが使用する通信規約の名前」は、Webやメールで使う通信規約の名前はHTTP、SMTPなどのプロトコル名です。
  「コンピュータやネットワークなどを識別するための名前」が正しいです。ドメイン名はコンピュータやネットワークを識別する名前です。
  「通信を行うアプリケーションを識別するための名前」は、通信サービスやアプリケーションを識別するのはポート番号です。
  「電子メールの宛先として指定する相手の名前」は、メールアドレスのローカル部は受信者を表しますが、ドメイン名そのものの説明ではありません。
