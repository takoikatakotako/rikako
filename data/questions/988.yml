# 令和6年度 ITパスポート 公開問題 問8
id: 988
type: single_choice
text: |
  表はA社の期末の損益計算書から抜粋した資料である。当期純利益が800百万円であるとき、販売費及び一般管理費は何百万円か。
  
  （単位 百万円）
  売上高: 8,000
  売上原価: 6,000
  販売費及び一般管理費: ■
  営業外収益: 150
  営業外費用: 50
  特別利益: 60
  特別損失: 10
  法人税等: 350
choices:
  - "850"
  - "900"
  - "1,000"
  - "1,200"
correct: 2
explanation: |
  売上総利益は8,000－6,000＝2,000百万円です。販売費及び一般管理費をxとすると、当期純利益は2,000－x＋150－50＋60－10－350＝800なので、x＝1,000百万円です。

  「850」は、販管費を850百万円とすると当期純利益は950百万円となり、条件と一致しません。
  「900」は、販管費を900百万円とすると当期純利益は900百万円となり、条件と一致しません。
  「1,000」が正しいです。販管費1,000百万円のとき当期純利益が800百万円になります。
  「1,200」は、販管費を1,200百万円とすると当期純利益は600百万円となり、条件と一致しません。
