# 令和6年度 ITパスポート 公開問題 問97
id: 1077
type: single_choice
text: |
  次のOSのうち、OSS（Open Source Software）として提供されるものだけを全て挙げたものはどれか。
  
  a Android  b FreeBSD  c iOS  d Linux
choices:
  - "a, b"
  - "a, b, d"
  - "b, d"
  - "c, d"
correct: 1
explanation: |
  Androidの基盤であるAOSP、FreeBSD、LinuxはOSSとしてソースコードと利用条件が公開されています。iOSはAppleのプロプライエタリなOSなので、a、b、dが該当します。

  「a, b」は、aとbはOSSですが、dのLinuxもOSSなので不足しています。
  「a, b, d」が正しいです。Androidの基盤、FreeBSD、LinuxはOSSとして提供されます。
  「b, d」は、bとdはOSSですが、aのAndroidの基盤もOSSです。
  「c, d」は、dはOSSですが、cのiOSはプロプライエタリであり、aとbも漏れています。
