# 令和6年度 ITパスポート 公開問題 問24
id: 1004
type: single_choice
text: |
  式は定期発注方式で原料の発注量を求める計算式である。a〜cに入れる字句の適切な組合せはどれか。
  
  発注量＝（a＋調達期間）×毎日の使用予定量＋b－現在の在庫量－c
choices:
  - "a:発注日数, b:安全在庫量, c:現在の発注残"
  - "a:営業日数, b:現在の発注残, c:安全在庫量"
  - "a:発注間隔, b:安全在庫量, c:現在の発注残"
  - "a:発注間隔, b:現在の発注残, c:安全在庫量"
correct: 2
explanation: |
  定期発注方式では、次回入荷までの需要を「発注間隔＋調達期間」で見積もり、安全在庫を加え、現在庫と発注残を差し引きます。したがってaは発注間隔、bは安全在庫量、cは現在の発注残です。

  「a:発注日数, b:安全在庫量, c:現在の発注残」は、aの名称が不適切です。一定なのは発注日数ではなく発注間隔です。
  「a:営業日数, b:現在の発注残, c:安全在庫量」は、aと、b・cの加減が不適切です。安全在庫は加え、発注残は差し引きます。
  「a:発注間隔, b:安全在庫量, c:現在の発注残」が正しいです。発注間隔と調達期間中の需要に安全在庫を加え、発注残を差し引きます。
  「a:発注間隔, b:現在の発注残, c:安全在庫量」は、安全在庫量と発注残の位置が逆です。
