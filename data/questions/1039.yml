# 令和6年度 ITパスポート 公開問題 問59
id: 1039
type: single_choice
text: |
  OCRの役割として、適切なものはどれか。
choices:
  - "10cm程度の近距離にある機器間で無線通信する。"
  - "印刷文字や手書き文字を認識し、テキストデータに変換する。"
  - "デジタル信号処理によって、人工的に音声を作り出す。"
  - "利用者の指先などが触れたパネル上の位置を検出する。"
correct: 1
explanation: |
  OCR（光学的文字認識）は、画像中の印刷文字や手書き文字を認識し、編集や検索ができるテキストデータへ変換する技術です。

  ア：近距離で無線通信する技術はNFCです。
  イ：正しいです。印刷文字や手書き文字を認識してテキストへ変換します。
  ウ：デジタル処理で音声を作る技術は音声合成です。
  エ：パネルに触れた位置を検出する装置はタッチパネルです。
