# 令和6年度 ITパスポート 公開問題 問72
id: 1052
type: single_choice
text: |
  次の記述のうち、バイオメトリクス認証の例だけを全て挙げたものはどれか。
  
  a Webページに並んだ文字の列から成る画像を表示し、読み取った文字列を利用者に入力させることによって、認証を行う。
  b キーボードで特定文字列を入力させ、そのときの打鍵の速度やタイミングの変化によって、認証を行う。
  c タッチパネルに手書きで氏名を入力させ、そのときの筆跡、筆圧、運筆速度などによって、認証を行う。
  d タッチパネルに表示された複数の点をあらかじめ決められた順になぞらせることによって、認証を行う。
choices:
  - "a, b"
  - "a, d"
  - "b, c"
  - "c, d"
correct: 2
explanation: |
  打鍵の速度・間隔や、署名時の筆跡・筆圧・運筆速度は、個人の行動的特徴を用いるバイオメトリクス認証です。CAPTCHAは人間か機械かの判定、画面上の点をなぞる方式は知識認証です。
