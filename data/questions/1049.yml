# 令和6年度 ITパスポート 公開問題 問69
id: 1049
type: single_choice
text: |
  障害に備えるために、4台のHDDを使い、1台分の容量をパリティ情報の記録に使用するRAID5を構成する。1台のHDDの容量が1Tバイトのとき、実効データ容量はおよそ何バイトか。
choices:
  - "2T"
  - "3T"
  - "4T"
  - "5T"
correct: 1
explanation: |
  RAID5では、全ディスクに分散して1台分相当のパリティを保存するため、実効容量は「台数－1」台分です。4台×1Tバイトなら(4－1)×1＝3Tバイトです。
