# 令和6年度 ITパスポート 公開問題 問65
id: 1045
type: single_choice
text: |
  AIにおける機械学習の学習方法に関する次の記述中のa〜cに入れる字句の適切な組合せはどれか。
  
  教師あり学習は、正解を付けた学習データを入力することによって、aと呼ばれる手法で未知のデータを複数のクラスに分けたり、bと呼ばれる手法でデータの関係性を見つけたりすることができるようになる学習方法である。教師なし学習は、正解を付けない学習データを入力することによって、cと呼ばれる手法などで次第にデータを正しくグループ分けできるようになる学習方法である。
choices:
  - "a:回帰, b:分類, c:クラスタリング"
  - "a:クラスタリング, b:分類, c:回帰"
  - "a:分類, b:回帰, c:クラスタリング"
  - "a:分類, b:クラスタリング, c:回帰"
correct: 2
explanation: |
  教師あり学習では、正解付きデータを使って分類や回帰を学習します。教師なし学習では、正解のないデータから似たものをまとめるクラスタリングなどを行います。

  ア：教師あり学習でクラス分けを行うaは回帰ではなく分類です。
  イ：クラスタリングは正解なしデータを扱う教師なし学習で使われます。
  ウ：正しいです。教師あり学習では分類と回帰、教師なし学習ではクラスタリングを行います。
  エ：bとcが逆です。関係性の予測は回帰、グループ分けはクラスタリングです。
