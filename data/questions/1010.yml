# 令和6年度 ITパスポート 公開問題 問30
id: 1010
type: single_choice
text: |
  上司から自社の当期の損益計算書を渡され、"我が社の収益性分析をしなさい"と言われた。経営に関する指標のうち、この損益計算書だけから計算できるものだけを全て挙げたものはどれか。
  
  a 売上高増加率  b 売上高利益率  c 自己資本利益率
choices:
  - "a"
  - "a, b"
  - "a, b, c"
  - "b"
correct: 3
explanation: |
  売上高利益率は、損益計算書にある売上高と利益だけで計算できます。売上高増加率には前期の売上高が、自己資本利益率には貸借対照表にある自己資本が必要なので、当期の損益計算書だけでは求められません。

  ア：aの売上高増加率には前期の売上高が必要で、当期の損益計算書だけでは計算できません。
  イ：bは計算できますが、aは当期の損益計算書だけでは計算できません。
  ウ：aには前期売上高、cには貸借対照表の自己資本が必要です。
  エ：正しいです。bの売上高利益率だけが当期の損益計算書から求められます。
