# 令和6年度 ITパスポート 公開問題 問32
id: 1012
type: single_choice
text: |
  労働者派遣における派遣労働者の雇用関係に関する記述のうち、適切なものはどれか。
choices:
  - "派遣先との間に雇用関係があり、派遣元との間には存在しない。"
  - "派遣元との間に雇用関係があり、派遣先との間には存在しない。"
  - "派遣元と派遣先のいずれの間にも雇用関係が存在する。"
  - "派遣元と派遣先のいずれの間にも雇用関係は存在しない。"
correct: 1
explanation: |
  派遣労働者を雇用するのは派遣元であり、派遣元との間に雇用関係があります。派遣先との間に雇用関係はありませんが、業務上の指揮命令は派遣先が行います。

  ア：派遣先は業務上の指揮命令を行いますが、派遣労働者を雇用する事業者ではありません。
  イ：正しいです。雇用契約は派遣元と結ばれ、派遣先との雇用関係はありません。
  ウ：二重に雇用されるのではなく、雇用関係は派遣元との間だけにあります。
  エ：派遣労働者には派遣元との雇用関係があるので、どちらにも存在しないという説明は誤りです。
