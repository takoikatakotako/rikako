# 化学基礎 問28
id: 695
type: single_choice
text: |
  分子からなる物質として、最も適切なものはどれか。
choices:
  - "二酸化炭素"
  - "塩化ナトリウム"
  - "鉄"
  - "銅"
correct: 0
explanation: |
  この問題は、「分子からなる物質を見分ける問題」です。
  
  二酸化炭素では、1個の炭素原子と2個の酸素原子が共有結合し、CO₂という独立したまとまりをつくっています。このような、原子が結び付いてできた独立した粒子を分子といいます。一方、塩化ナトリウムは、陽イオンと陰イオンが静電気的な引力で規則正しく並んだイオン結晶であり、独立したNaCl分子が集まっているわけではありません。鉄と銅は、金属の陽イオンが規則正しく並び、その間を自由電子が動く金属結晶で、こちらも分子からなる物質ではありません。したがって、正解は「二酸化炭素」です。
  
  「二酸化炭素」が正しいです。分子からなる代表的な物質です。
  「塩化ナトリウム」は、分子ではなくイオン結晶です。
  「鉄」は、分子からなる物質ではなく金属です。
  「銅」は、分子からなる物質ではなく金属です。
