# 令和6年度 ITパスポート 公開問題 問45
id: 1025
type: single_choice
text: |
  本番稼働後の業務遂行のために、業務別にサービス利用方法の手順を示した文書として、最も適切なものはどれか。
choices:
  - "FAQ"
  - "サービスレベル合意書"
  - "システム要件定義書"
  - "利用者マニュアル"
correct: 3
explanation: |
  利用者マニュアルは、本番稼働後に利用者が業務ごとの操作やサービス利用手順を確認するための文書です。SLAはサービス品質の合意、要件定義書は開発するシステムの要件を記述します。

  ア：FAQは、よくある質問と回答をまとめたもので、業務別の操作手順書ではありません。
  イ：SLAは、サービス提供者と利用者が品質水準などを合意する文書です。
  ウ：システム要件定義書は、開発するシステムに必要な機能や性能を定める文書です。
  エ：正しいです。本番稼働後の利用手順を業務別に示すのは利用者マニュアルです。
