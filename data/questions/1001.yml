# 令和6年度 ITパスポート 公開問題 問21
id: 1001
type: single_choice
text: |
  あるソフトウェアは、定額の料金や一定の期間での利用ができる形態で提供されている。この利用形態を表す用語として、適切なものはどれか。
choices:
  - "アクティベーション"
  - "アドウェア"
  - "サブスクリプション"
  - "ボリュームライセンス"
correct: 2
explanation: |
  サブスクリプションは、月額や年額などの定額料金を支払い、契約期間中に製品やサービスを利用する形態です。買い切り型のライセンスとは異なります。

  ア：アクティベーションは、ライセンス認証などによってソフトウェアを有効化する手続です。
  イ：アドウェアは、広告表示を主な目的とするソフトウェアです。
  ウ：正しいです。定額料金を支払い、契約期間中サービスを利用する形態です。
  エ：ボリュームライセンスは、企業などが多数の利用権をまとめて購入する形態です。
