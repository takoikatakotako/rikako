# 令和6年度 ITパスポート 公開問題 問33
id: 1013
type: single_choice
text: |
  次の記述のうち、業務要件定義が曖昧なことが原因で起こり得る問題だけを全て挙げたものはどれか。
  
  a 企画プロセスでシステム化構想がまとまらず、システム化の承認を得られない。
  b コーディングのミスによって、システムが意図したものと違う動作をする。
  c システムの開発中に仕様変更による手戻りが頻発する。
  d システムを受け入れるための適切な受入テストを設計できない。
choices:
  - "a, b"
  - "b, c"
  - "b, d"
  - "c, d"
correct: 3
explanation: |
  業務要件が曖昧だと、開発中に認識違いが判明して仕様変更や手戻りが発生し、期待結果が定まらないため受入テストも設計できません。コーディングミスは実装上の問題であり、システム化構想の承認は業務要件定義より前の企画段階です。
