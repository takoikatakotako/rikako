# 令和6年度 ITパスポート 公開問題 問42
id: 1022
type: single_choice
text: |
  システム監査人の役割として、適切なものだけを全て挙げたものはどれか。
  
  a 監査手続の種類、実施時期、適用範囲などについて、監査計画を立案する。
  b 監査の目的に応じた監査報告書を作成し、社内に公開する。
  c 監査報告書にある改善提案に基づく改善の実施を監査対象部門に指示する。
  d 監査報告書にある改善提案に基づく改善の実施状況をモニタリングする。
choices:
  - "a, b"
  - "a, d"
  - "b, c"
  - "c, d"
correct: 1
explanation: |
  システム監査人は、監査計画を立案して監査を実施し、改善提案後の実施状況を継続的に確認します。改善を命令する権限や、監査報告書を自ら社内公開する権限を当然にもつわけではありません。
