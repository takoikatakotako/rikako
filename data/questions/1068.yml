# 令和6年度 ITパスポート 公開問題 問88
id: 1068
type: single_choice
text: |
  JavaScriptに関する記述として、適切なものはどれか。
choices:
  - "Webブラウザ上に、動的な振る舞いなどを組み込むことができる。"
  - "Webブラウザではなく、Webサーバ上だけで動作する。"
  - "実行するためには、あらかじめコンパイルする必要がある。"
  - "名前のとおり、Javaのスクリプト版である。"
correct: 0
explanation: |
  JavaScriptは、主にWebブラウザ上で実行され、画面の書換えや利用者操作への応答など動的な振る舞いをWebページへ加えられる言語です。Javaとは別のプログラミング言語です。

  「Webブラウザ上に、動的な振る舞いなどを組み込むことができる。」が正しいです。ブラウザ上でWebページへ動的な振る舞いを追加できます。
  「Webブラウザではなく、Webサーバ上だけで動作する。」は、JavaScriptはブラウザでも動作し、サーバ上だけで動く言語ではありません。
  「実行するためには、あらかじめコンパイルする必要がある。」は、通常はブラウザの実行環境が解釈・実行でき、事前コンパイルが必須ではありません。
  「名前のとおり、Javaのスクリプト版である。」は、JavaScriptとJavaは名称が似ていますが、別のプログラミング言語です。
