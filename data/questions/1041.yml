# 令和6年度 ITパスポート 公開問題 問61
id: 1041
type: single_choice
text: |
  cookieを説明したものはどれか。
choices:
  - "Webサイトが、Webブラウザを通じて訪問者のPCにデータを書き込んで保存する仕組み又は保存されるデータのこと"
  - "Webブラウザが、アクセスしたWebページをファイルとしてPCのハードディスクに一時的に保存する仕組み又は保存されるファイルのこと"
  - "Webページ上で、Webサイトの紹介などを目的に掲載されている画像のこと"
  - "ブログの機能の一つで、リンクを張った相手に対してその旨を通知する仕組みのこと"
correct: 0
explanation: |
  cookieは、Webサイトがブラウザを通して利用者の端末に識別子や設定などを保存する仕組み、又はそのデータです。再訪時のログイン状態や利用者設定の維持などに使われます。

  ア：正しいです。Webサイトがブラウザを通じて端末へ保存するデータです。
  イ：アクセスしたページを一時保存する仕組みはブラウザキャッシュです。
  ウ：Webページ上の紹介・広告画像はバナーです。
  エ：リンクしたことを相手のブログへ通知する仕組みはトラックバックです。
