# 令和6年度 ITパスポート 公開問題 問70
id: 1050
type: single_choice
text: |
  ESSIDをステルス化することによって得られる効果として、適切なものはどれか。
choices:
  - "アクセスポイントと端末間の通信を暗号化できる。"
  - "アクセスポイントに接続してくる端末を認証できる。"
  - "アクセスポイントへの不正接続リスクを低減できる。"
  - "アクセスポイントを介さず、端末同士で直接通信できる。"
correct: 2
explanation: |
  ESSIDのステルス化は、アクセスポイントがネットワーク名を周囲へ通知しないようにし、一覧から見つかりにくくするため、不正接続のリスク低減に一定の効果があります。ただし、通信の暗号化や端末認証を行う機能ではありません。

  ア：通信の暗号化にはWPAなどの暗号化方式を使い、ESSIDステルスだけでは実現できません。
  イ：端末認証には認証方式やアクセス制御を使い、ESSIDステルスだけでは実現できません。
  ウ：正しいです。ネットワーク名を一覧に表示しにくくし、不正接続リスクを一定程度低減します。
  エ：端末同士の直接通信はアドホックモードなどの説明で、ESSIDステルスの効果ではありません。
