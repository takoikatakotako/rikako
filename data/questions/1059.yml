# 令和6年度 ITパスポート 公開問題 問79
id: 1059
type: single_choice
text: |
  企業などの内部ネットワークとインターネットとの間にあって、セキュリティを確保するために内部ネットワークのPCに代わって、インターネット上のWebサーバにアクセスするものはどれか。
choices:
  - "DNSサーバ"
  - "NTPサーバ"
  - "ストリーミングサーバ"
  - "プロキシサーバ"
correct: 3
explanation: |
  プロキシサーバは、内部ネットワークの端末を代理して外部のWebサーバへアクセスします。通信の中継、アクセス制御、ログ取得、キャッシュなどによって安全性や効率を高めます。

  ア：DNSサーバは、ドメイン名とIPアドレスを対応付けます。
  イ：NTPサーバは、ネットワーク上の機器の時刻を同期します。
  ウ：ストリーミングサーバは、音声や映像を連続的に配信します。
  エ：正しいです。プロキシサーバは内部端末を代理して外部のWebサーバへアクセスします。
