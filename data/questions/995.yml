# 令和6年度 ITパスポート 公開問題 問15
id: 995
type: single_choice
text: |
  必要な時期に必要な量の原材料や部品を調達することによって、工程間の在庫をできるだけもたないようにする生産方式はどれか。
choices:
  - "BPO"
  - "CIM"
  - "JIT"
  - "OEM"
correct: 2
explanation: |
  JIT（Just In Time）は、必要な物を必要な時に必要な量だけ調達・生産し、工程間の在庫を最小限にする生産方式です。OEMは他社ブランド製品を受託製造する形態です。

  「BPO」は、BPOは、業務プロセスの一部を外部事業者へ委託することです。
  「CIM」は、CIMは、生産に関する情報をコンピュータで統合する仕組みです。
  「JIT」が正しいです。必要な物を必要な時に必要な量だけ調達・生産します。
  「OEM」は、OEMは、他社ブランドで販売される製品を受託製造する形態です。
