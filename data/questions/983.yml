# 令和6年度 ITパスポート 公開問題 問3
id: 983
type: single_choice
text: |
  未来のある時点に目標を設定し、そこを起点に現在を振り返り、目標実現のために現在すべきことを考える方法を表す用語として、最も適切なものはどれか。
choices:
  - "PoC (Proof of Concept)"
  - "PoV (Proof of Value)"
  - "バックキャスティング"
  - "フォアキャスティング"
correct: 2
explanation: |
  バックキャスティングは、望ましい未来の目標を先に定め、そこから現在へ逆算して必要な施策を考える方法です。現在や過去の延長から将来を予測するフォアキャスティングとは、考える方向が逆です。

  「PoC (Proof of Concept)」は、PoCは、新しい技術やアイデアが実現可能かを小規模に検証することです。
  「PoV (Proof of Value)」は、PoVは、技術や施策が期待する価値を生むかを検証することです。
  「バックキャスティング」が正しいです。未来の目標から現在へ逆算して行動を考えます。
  「フォアキャスティング」は、現在や過去の実績を起点に、その延長として将来を予測する方法です。
