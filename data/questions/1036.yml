# 令和6年度 ITパスポート 公開問題 問56
id: 1036
type: single_choice
text: |
  PCにおいて、電力供給を断つと記憶内容が失われるメモリ又は記憶媒体はどれか。
choices:
  - "DVD-RAM"
  - "DRAM"
  - "ROM"
  - "フラッシュメモリ"
correct: 1
explanation: |
  DRAMは、電力供給がなくなると記憶内容を失う揮発性メモリです。ROM、フラッシュメモリ、DVD-RAMは、電源を切っても内容を保持する不揮発性の記憶媒体です。

  ア：DVD-RAMは、電源を切っても内容を保持する光ディスクです。
  イ：正しいです。DRAMは電力供給が止まると内容を失う揮発性メモリです。
  ウ：ROMは、電源を切っても内容を保持する不揮発性メモリです。
  エ：フラッシュメモリは、電源を切っても内容を保持する不揮発性メモリです。
