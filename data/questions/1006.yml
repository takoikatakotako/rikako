# 令和6年度 ITパスポート 公開問題 問26
id: 1006
type: single_choice
text: |
  データサイエンティストの役割に関する記述として、最も適切なものはどれか。
choices:
  - "機械学習や統計などの手法を用いてビッグデータを解析することによって、ビジネスに活用するための新たな知見を獲得する。"
  - "企業が保有する膨大なデータを高速に検索できるように、パフォーマンスの高いデータベースを運用するためのシステム基盤を構築する。"
  - "企業における情報システムに関するリスクを評価するために、現場でのデータの取扱いや管理についての実態を調査する。"
  - "企業や組織における安全な情報システムの企画、設計、開発、運用で、サイバーセキュリティに関する専門的な知識や技能を活用して支援する。"
correct: 0
explanation: |
  データサイエンティストは、統計学や機械学習を使って大量のデータを分析し、ビジネス上の課題解決や意思決定に役立つ知見を導き出します。

  ア：正しいです。統計や機械学習でデータを分析し、事業に役立つ知見を導きます。
  イ：データベース基盤の構築・運用を担うデータベースエンジニアなどの役割です。
  ウ：情報システムのリスクや管理状況を評価するシステム監査人の役割です。
  エ：安全なシステムを支援する情報セキュリティ専門家の役割です。
