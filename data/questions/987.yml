# 令和6年度 ITパスポート 公開問題 問7
id: 987
type: single_choice
text: |
  システム開発の上流工程において、業務プロセスのモデリングを行う目的として、最も適切なものはどれか。
choices:
  - "業務プロセスで取り扱う大量のデータを、統計的手法やAI手法などを用いて分析し、データ間の相関関係や隠れたパターンなどを見いだすため"
  - "業務プロセスを可視化することによって、適切なシステム設計のベースとなる情報を整備し、関係者間で解釈を共有できるようにするため"
  - "個々の従業員がもっている業務に関する知識・経験やノウハウを社内全体で共有し、創造的なアイデアを生み出すため"
  - "プロジェクトに必要な要員を調達し、チームとして組織化して、プロジェクトの目的の達成に向けて一致団結させるため"
correct: 1
explanation: |
  業務プロセスのモデリングでは、業務の流れや役割を可視化します。これにより、システム設計の基礎となる情報を整理し、関係者が同じ解釈を共有できるようになります。

  ア：大量データから相関やパターンを探すデータマイニングの目的です。
  イ：正しいです。業務を可視化し、設計の基礎と関係者間の共通理解を作ります。
  ウ：個人の知識や経験を組織で共有するナレッジマネジメントの目的です。
  エ：要員をチームとしてまとめるプロジェクトチーム形成の活動です。
