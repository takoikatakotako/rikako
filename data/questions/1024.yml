# 令和6年度 ITパスポート 公開問題 問44
id: 1024
type: single_choice
text: |
  提供しているITシステムが事業のニーズを満たせるように、人材、プロセス、情報技術を適切に組み合わせ、継続的に改善して管理する活動として、最も適切なものはどれか。
choices:
  - "ITサービスマネジメント"
  - "システム監査"
  - "ヒューマンリソースマネジメント"
  - "ファシリティマネジメント"
correct: 0
explanation: |
  ITサービスマネジメントは、事業ニーズを満たすITサービスを提供するため、人、プロセス、技術を組み合わせて継続的に管理・改善する活動です。

  ア：正しいです。ITサービスを事業ニーズに合わせて継続的に管理・改善します。
  イ：システム監査は、独立した立場からリスク対応状況を評価・助言する活動です。
  ウ：ヒューマンリソースマネジメントは、人材の採用・育成・配置などを管理する活動です。
  エ：ファシリティマネジメントは、建物や設備などの施設を管理・活用する活動です。
