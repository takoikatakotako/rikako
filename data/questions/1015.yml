# 令和6年度 ITパスポート 公開問題 問35
id: 1015
type: single_choice
text: |
  実用新案に関する記述として、最も適切なものはどれか。
choices:
  - "今までにない製造方法は、実用新案の対象となる。"
  - "自然法則を利用した技術的思想の創作で高度なものだけが、実用新案の対象となる。"
  - "新規性の審査に合格したものだけが実用新案として登録される。"
  - "複数の物品を組み合わせて考案した新たな製品は、実用新案の対象となる。"
correct: 3
explanation: |
  実用新案は、物品の形状、構造又は組合せに係る考案を保護します。複数の物品を組み合わせた新しい製品は対象になり得ますが、製造方法は対象外で、特許のような実体的な新規性審査を経ずに登録されます。

  「今までにない製造方法は、実用新案の対象となる。」は、製造方法は実用新案の対象ではなく、特許の対象になり得ます。
  「自然法則を利用した技術的思想の創作で高度なものだけが、実用新案の対象となる。」は、高度な技術的思想の創作は特許の定義であり、実用新案は物品の考案を保護します。
  「新規性の審査に合格したものだけが実用新案として登録される。」は、実用新案は実体的な新規性審査を経ず、基礎的要件の審査で登録されます。
  「複数の物品を組み合わせて考案した新たな製品は、実用新案の対象となる。」が正しいです。物品の形状・構造・組合せに係る新しい考案は対象になり得ます。
