# 令和6年度 ITパスポート 公開問題 問25
id: 1005
type: single_choice
text: |
  史跡などにスマートフォンを向けると、昔あった建物の画像や説明情報を現実の風景と重ねるように表示して、観光案内をできるようにした。ここで活用した仕組みを表す用語として、最も適切なものはどれか。
choices:
  - "AR"
  - "GUI"
  - "VR"
  - "メタバース"
correct: 0
explanation: |
  AR（拡張現実）は、現実の風景に画像や文字などのデジタル情報を重ねて表示する技術です。現実から切り離された仮想空間を体験するVRとは異なります。

  ア：正しいです。現実の風景へ建物画像や説明を重ねるARの利用例です。
  イ：GUIは、アイコンやボタンなどを使って視覚的に操作するインタフェースです。
  ウ：VRは、コンピュータで作られた仮想空間を現実のように体験する技術です。
  エ：メタバースは、多人数が参加できるインターネット上の仮想空間です。
