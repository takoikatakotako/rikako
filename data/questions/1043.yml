# 令和6年度 ITパスポート 公開問題 問63
id: 1043
type: single_choice
text: |
  SSDの全てのデータを消去し、復元できなくする方法として用いられているものはどれか。
choices:
  - "Secure Erase"
  - "磁気消去"
  - "セキュアブート"
  - "データクレンジング"
correct: 0
explanation: |
  Secure Eraseは、SSDのコントローラが備える消去機能を使って、媒体全体のデータを復元困難にする方法です。磁気消去は半導体であるSSDには有効ではありません。

  「Secure Erase」が正しいです。SSD内の全データを消去する専用機能です。
  「磁気消去」は、SSDは半導体メモリなので、磁気ディスク向けの磁気消去は有効ではありません。
  「セキュアブート」は、セキュアブートは、起動時に読み込むソフトウェアの正当性を確認する機能です。
  「データクレンジング」は、データクレンジングは、データの表記揺れや誤りを修正して品質を高める処理です。
