# 令和6年度 ITパスポート 公開問題 問85
id: 1065
type: single_choice
text: |
  関数binaryToIntegerは、1桁以上の符号なし2進数を文字列で表した値を引数binaryStrで受け取り、その値を整数に変換した結果を戻り値とする。例えば、引数として"100"を受け取ると、4を返す。プログラム中のa, bに入れる字句の適切な組合せはどれか。
choices:
  - "a: (2のi乗) − 1, b: integerNum × digitNum × exponent"
  - "a: (2のi乗) − 1, b: integerNum + digitNum × exponent"
  - "a: 2の(i − 1)乗, b: integerNum × digitNum × exponent"
  - "a: 2の(i − 1)乗, b: integerNum + digitNum × exponent"
correct: 3
explanation: |
  右端の桁を第1桁とすると、その重みは2⁰で、左へ進むごとに2の指数が1ずつ増えます。各桁について「数値＋その桁の値×2^(桁位置－1)」を加算すれば、2進数を整数へ変換できます。

  ア：重みの式に加え、既存の値へ加算せず乗算しているため整数値を求められません。
  イ：加算式は適切ですが、各桁の重みは「2のi乗－1」ではありません。
  ウ：重みは適切ですが、各桁の値は既存の合計へ加算する必要があります。
  エ：正しいです。重み2^(i－1)を各桁に掛け、integerNumへ加算します。
