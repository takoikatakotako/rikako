# 令和6年度 ITパスポート 公開問題 問81
id: 1061
type: single_choice
text: |
  一つの表で管理されていた受注データを、受注に関する情報と商品に関する情報に分割して、正規化を行った上で関係データベースの表で管理する。正規化を行った結果の表の組合せとして、最も適切なものはどれか。ここで、同一商品で単価が異なるときは商品番号も異なるものとする。また、発注者名には同姓同名はいないものとする。
choices:
  - "表1: [受注番号, 発注者名] と 表2: [商品名, 個数, 単価]"
  - "表1: [受注番号, 発注者名, 商品番号] と 表2: [商品名, 個数, 単価]"
  - "表1: [受注番号, 発注者名, 商品番号, 個数] と 表2: [商品番号, 商品名]"
  - "表1: [受注番号, 発注者名, 商品番号, 個数] と 表2: [商品番号, 商品名, 単価]"
correct: 3
explanation: |
  商品番号が決まれば商品名と単価が決まるため、この三つを商品表に分離します。受注ごとに変わる個数は、受注番号、発注者名、商品番号とともに受注表へ置き、両表を商品番号で関連付けます。

  ア：受注表に商品番号がなく両表を関連付けられず、個数も商品ごとではなく受注ごとに変わります。
  イ：個数は商品表ではなく受注表に置くべきで、単価は商品番号に従属します。
  ウ：単価は商品番号で決まるため、受注表ではなく商品表に分離すべきです。
  エ：正しいです。受注表に個数、商品表に商品名と単価を置き、商品番号で関連付けます。
