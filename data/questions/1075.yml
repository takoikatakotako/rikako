# 令和6年度 ITパスポート 公開問題 問95
id: 1075
type: single_choice
text: |
  AIの関連技術であるディープラーニングに用いられる技術として、最も適切なものはどれか。
choices:
  - "ソーシャルネットワーク"
  - "ニューラルネットワーク"
  - "フィージビリティスタディ"
  - "フォールトトレラント"
correct: 1
explanation: |
  ディープラーニングは、多層のニューラルネットワークを用いてデータの特徴を段階的に学習する機械学習手法です。

  「ソーシャルネットワーク」は、ソーシャルネットワークは人や組織の関係を表す概念で、ディープラーニングの中核技術ではありません。
  「ニューラルネットワーク」が正しいです。ディープラーニングは多層のニューラルネットワークを用います。
  「フィージビリティスタディ」は、フィージビリティスタディは、計画や事業の実現可能性を事前に調査することです。
  「フォールトトレラント」は、フォールトトレラントは、障害が起きても機能を継続できるようにする設計思想です。
