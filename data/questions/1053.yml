# 令和6年度 ITパスポート 公開問題 問73
id: 1053
type: single_choice
text: |
  IoT機器のセキュリティ対策のうち、ソーシャルエンジニアリング対策として、最も適切なものはどれか。
choices:
  - "IoT機器とサーバとの通信は、盗聴を防止するために常に暗号化通信で行う。"
  - "IoT機器の脆弱性を突いた攻撃を防止するために、機器のメーカーから最新のファームウェアを入手してアップデートを行う。"
  - "IoT機器へのマルウェア感染を防止するためにマルウェア対策ソフトを導入する。"
  - "IoT機器を廃棄するときは、内蔵されている記憶装置からの情報漏えいを防止するために物理的に破壊する。"
correct: 3
explanation: |
  廃棄された機器から情報を拾い出す行為は、管理の隙や人の行動を利用するソーシャルエンジニアリングの一種です。記憶装置を物理的に破壊すれば、廃棄後の情報取得を防げます。

  「IoT機器とサーバとの通信は、盗聴を防止するために常に暗号化通信で行う。」は、通信の暗号化は盗聴への技術的対策です。
  「IoT機器の脆弱性を突いた攻撃を防止するために、機器のメーカーから最新のファームウェアを入手してアップデートを行う。」は、ファームウェア更新は既知の脆弱性を悪用する攻撃への技術的対策です。
  「IoT機器へのマルウェア感染を防止するためにマルウェア対策ソフトを導入する。」は、マルウェア対策ソフトは不正プログラムへの技術的対策です。
  「IoT機器を廃棄するときは、内蔵されている記憶装置からの情報漏えいを防止するために物理的に破壊する。」が正しいです。廃棄機器から情報を拾う行為を、記憶装置の物理破壊で防ぎます。
