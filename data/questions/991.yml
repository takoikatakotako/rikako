# 令和6年度 ITパスポート 公開問題 問11
id: 991
type: single_choice
text: |
  品質に関する組織やプロセスの運営管理を標準化し、マネジメントの質や効率の向上を目的とした方策として、適切なものはどれか。
choices:
  - "ISMSの導入"
  - "ISO 9001の導入"
  - "ITILの導入"
  - "プライバシーマークの取得"
correct: 1
explanation: |
  ISO 9001は、製品やサービスの品質を継続的に改善する品質マネジメントシステムの国際規格です。ISMSは情報セキュリティ、ITILはITサービス管理、プライバシーマークは個人情報保護に関する仕組みです。

  ア：ISMSは情報セキュリティを管理する仕組みであり、品質管理を主目的としません。
  イ：正しいです。ISO 9001は品質マネジメントシステムの国際規格です。
  ウ：ITILはITサービスマネジメントのベストプラクティスです。
  エ：プライバシーマークは、個人情報を適切に扱う体制を評価する制度です。
