# 令和6年度 ITパスポート 公開問題 問80
id: 1060
type: single_choice
text: |
  OSS（Open Source Software）に関する記述として、適切なものだけを全て挙げたものはどれか。
  
  a OSSを利用して作成したソフトウェアを販売することができる。
  b ソースコードが公開されたソフトウェアは全てOSSである。
  c 著作権が放棄されているソフトウェアである。
choices:
  - "a"
  - "a, b"
  - "b, c"
  - "c"
correct: 0
explanation: |
  OSSはライセンス条件を守れば、利用・改変したソフトウェアを販売できます。ソースコードが閲覧できるだけではOSSとは限らず、著作権も通常は放棄されていません。したがって該当するのはaだけです。

  「a」が正しいです。OSSはライセンス条件を守れば販売できるので、該当するのはaだけです。
  「a, b」は、bは誤りです。ソースコードが公開されていても、OSSライセンスで利用・改変・再配布できるとは限りません。
  「b, c」は、bに加えcも誤りです。OSSにも通常は著作権者が存在します。
  「c」は、cは誤りです。OSSは著作権放棄されたソフトウェアという意味ではありません。
