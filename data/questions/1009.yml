# 令和6年度 ITパスポート 公開問題 問29
id: 1009
type: single_choice
text: |
  ある企業が、顧客を引き付ける優れたUX（User Experience）やビジネスモデルをデジタル技術によって創出し、業界における従来のサービスを駆逐してしまうことによって、その業界の既存の構造が破壊されるような現象を表す用語として、最も適切なものはどれか。
choices:
  - "デジタルサイネージ"
  - "デジタルディスラプション"
  - "デジタルディバイド"
  - "デジタルトランスフォーメーション"
correct: 1
explanation: |
  デジタルディスラプションは、デジタル技術による新しいサービスやビジネスモデルが既存事業を駆逐し、業界構造を破壊的に変える現象です。DXは組織や社会をデジタル技術で変革する取組を広く指します。

  「デジタルサイネージ」は、デジタルサイネージは、ディスプレイなどに映像や情報を表示する電子看板です。
  「デジタルディスラプション」が正しいです。デジタル技術が既存の業界構造を破壊的に変える現象です。
  「デジタルディバイド」は、デジタルディバイドは、デジタル技術を利用できる人とできない人の格差です。
  「デジタルトランスフォーメーション」は、DXはデジタル技術による業務・組織・事業の変革であり、既存業界の破壊という現象に限定されません。
