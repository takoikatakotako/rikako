# 令和6年度 ITパスポート 公開問題 問83
id: 1063
type: single_choice
text: |
  1から6までの六つの目をもつサイコロを3回投げたとき、1回も1の目が出ない確率は幾らか。
choices:
  - "1/216"
  - "5/72"
  - "91/216"
  - "125/216"
correct: 3
explanation: |
  1回の試行で1以外が出る確率は5/6です。3回とも1が出ない確率は、各試行が独立なので(5/6)³＝125/216です。

  「1/216」は、1/216は3回とも1が出る確率です。
  「5/72」は、5/72は、3回とも1が出ない確率を正しく計算した値ではありません。
  「91/216」は、91/216は、少なくとも1回は1が出る確率です。
  「125/216」が正しいです。1以外が出る確率5/6を3回掛けて125/216になります。
