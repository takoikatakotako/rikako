# 令和6年度 ITパスポート 公開問題 問54
id: 1034
type: single_choice
text: |
  事業活動に関わる法令の遵守などを目的の一つとして、統制環境、リスクの評価と対応、統制活動、情報と伝達、モニタリング、ITへの対応から構成される取組はどれか。
choices:
  - "CMMI"
  - "ITIL"
  - "内部統制"
  - "リスク管理"
correct: 2
explanation: |
  内部統制は、業務の有効性・効率性、報告の信頼性、法令遵守、資産保全などを目的とする組織的な仕組みです。統制環境、リスク評価と対応、統制活動、情報と伝達、モニタリング、ITへの対応で構成されます。

  「CMMI」は、CMMIは、組織の開発・保守プロセスの成熟度を評価・改善するモデルです。
  「ITIL」は、ITILは、ITサービスマネジメントのベストプラクティスをまとめたものです。
  「内部統制」が正しいです。記載された六つの基本的要素で構成される取組は内部統制です。
  「リスク管理」は、リスク管理はリスクを特定・分析・対応する活動で、記載された統制全体の名称ではありません。
