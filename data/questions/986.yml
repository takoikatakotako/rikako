# 令和6年度 ITパスポート 公開問題 問6
id: 986
type: single_choice
text: |
  技術戦略の策定や技術開発の推進といった技術経営に直接の責任をもつ役職はどれか。
choices:
  - "CEO"
  - "CFO"
  - "COO"
  - "CTO"
correct: 3
explanation: |
  CTO（Chief Technology Officer）は最高技術責任者であり、技術戦略の策定や研究開発を統括します。CEOは最高経営責任者、CFOは最高財務責任者、COOは最高執行責任者です。

  「CEO」は、CEOは最高経営責任者で、企業経営全体を統括します。
  「CFO」は、CFOは最高財務責任者で、財務戦略や資金管理を統括します。
  「COO」は、COOは最高執行責任者で、日常の事業運営を統括します。
  「CTO」が正しいです。CTOは最高技術責任者として技術戦略や研究開発を統括します。
