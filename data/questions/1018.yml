# 令和6年度 ITパスポート 公開問題 問38
id: 1018
type: single_choice
text: |
  あるシステムの運用において、利用者との間でSLAを交わし、利用可能日を月曜日から金曜日、1日の利用可能時間を7時から22時まで、稼働率を98%以上で合意した。1週間の運用において、障害などでシステムの停止を許容できる時間は最大何時間か。
choices:
  - "0.3"
  - "1.5"
  - "1.8"
  - "2.1"
correct: 1
explanation: |
  利用可能時間は1日15時間×5日＝75時間です。稼働率98%では停止可能な割合は2%なので、75×0.02＝1.5時間が最大停止許容時間です。

  「0.3」は、0.3時間は利用可能時間75時間の0.4%で、停止可能な2%より小さい値です。
  「1.5」が正しいです。75時間×(1－0.98)＝1.5時間です。
  「1.8」は、1.8時間停止すると稼働率は97.6%となり、SLAの98%を下回ります。
  「2.1」は、2.1時間停止すると稼働率は97.2%となり、SLAの98%を下回ります。
