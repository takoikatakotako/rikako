# 令和6年度 ITパスポート 公開問題 問41
id: 1021
type: single_choice
text: |
  あるプロジェクトの作業間の関係と所要時間がアローダイアグラムで示されている。このアローダイアグラムのBからEの四つの結合点のうち、工程全体の完了時間に影響を与えることなく、その結合点から始まる全ての作業の開始を最も遅らせることができるものはどれか。ここで、各結合点から始まる作業はその結合点に至る作業が全て完了するまで開始できず、作業から次の作業への段取り時間は考えないものとする。
choices:
  - "B"
  - "C"
  - "D"
  - "E"
correct: 1
explanation: |
  各経路について最早時刻と最遅時刻を計算すると、結合点Cから始まる作業の開始を最も遅らせられます。この余裕時間（スラック）の範囲なら、工程全体の完了時刻には影響しません。

  「B」は、結合点Bはクリティカルパス上にあり、開始を遅らせる余裕がありません。
  「C」が正しいです。結合点Cには15の余裕があり、四つの中で最も開始を遅らせられます。
  「D」は、結合点Dの余裕は5であり、Cの余裕15より小さい値です。
  「E」は、結合点Eはクリティカルパス上にあり、開始を遅らせる余裕がありません。
