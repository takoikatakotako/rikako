# 令和6年度 ITパスポート 公開問題 問76
id: 1056
type: single_choice
text: |
  スマートフォンなどのタッチパネルで広く採用されている方式であり、指がタッチパネルの表面に近づいたときに、その位置を検出する方式はどれか。
choices:
  - "感圧式"
  - "光学式"
  - "静電容量方式"
  - "電磁誘導方式"
correct: 2
explanation: |
  静電容量方式は、指が画面に近づいたときの静電容量の変化を検出してタッチ位置を求めます。スマートフォンやタブレットで広く使われ、軽い接触や複数点の検出に適しています。

  ア：感圧式は、画面を押した圧力によって接触位置を検出します。
  イ：光学式は、赤外線などの光が遮られた位置を検出します。
  ウ：正しいです。指が近づいたことによる静電容量の変化を検出します。
  エ：電磁誘導方式は、専用ペンなどとの電磁的な作用で位置を検出します。
