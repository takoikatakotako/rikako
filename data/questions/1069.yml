# 令和6年度 ITパスポート 公開問題 問89
id: 1069
type: single_choice
text: |
  システムの利用者認証に関する記述のうち、適切なものはどれか。
choices:
  - "1回の認証で、複数のサーバやアプリケーションなどへのログインを実現する仕組みを、チャレンジレスポンス認証という。"
  - "指紋や声紋など、身体的な特徴を利用して本人認証を行う仕組みを、シングルサインオンという。"
  - "情報システムが利用者の本人確認のために用いる、数字の列から成る暗証番号のことを、PINという。"
  - "特定の数字や文字の並びではなく、位置についての情報を覚えておき、認証時には画面に表示された表の中で、自分が覚えている位置に並んでいる数字や文字をパスワードとして入力する方式を、多要素認証という。"
correct: 2
explanation: |
  PIN（Personal Identification Number）は、本人確認に用いる数字列の暗証番号です。1回の認証で複数サービスを使う仕組みはシングルサインオン、身体的特徴による認証はバイオメトリクス認証です。

  「1回の認証で、複数のサーバやアプリケーションなどへのログインを実現する仕組みを、チャレンジレスポンス認証という。」は、1回の認証で複数サービスへログインする仕組みはシングルサインオンです。
  「指紋や声紋など、身体的な特徴を利用して本人認証を行う仕組みを、シングルサインオンという。」は、指紋や声紋を使う仕組みはバイオメトリクス認証です。
  「情報システムが利用者の本人確認のために用いる、数字の列から成る暗証番号のことを、PINという。」が正しいです。PINは本人確認に使う数字列の暗証番号です。
  「特定の数字や文字の並びではなく、位置についての情報を覚えておき、認証時には画面に表示された表の中で、自分が覚えている位置に並んでいる数字や文字をパスワードとして入力する方式を、多要素認証という。」は、記憶した位置を使う方式はマトリクス認証であり、異なる要素を組み合わせる多要素認証とは異なります。
