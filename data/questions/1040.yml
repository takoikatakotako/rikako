# 令和6年度 ITパスポート 公開問題 問60
id: 1040
type: single_choice
text: |
  関係データベースを構成する要素の関係を表す図において、図中のa〜cに入れる字句の適切な組合せはどれか。
choices:
  - "a:表, b:フィールド, c:レコード"
  - "a:表, b:レコード, c:フィールド"
  - "a:フィールド, b:表, c:レコード"
  - "a:レコード, b:表, c:フィールド"
correct: 1
explanation: |
  関係データベースは表の集まりで、表の横一行をレコード、各列の項目をフィールドと呼びます。したがって、図の包含関係は表、レコード、フィールドの順です。
