# 令和6年度 ITパスポート 公開問題 問99
id: 1079
type: single_choice
text: |
  GPSの電波を捕捉しにくいビルの谷間や狭い路地などでも位置を計測することができるように、特定の地域の上空に比較的長く留まる軌道をとり、GPSと併用することによって、より高い測位精度を実現するものはどれか。
choices:
  - "アシストGPS"
  - "ジャイロセンサー"
  - "準天頂衛星"
  - "プローブカー"
correct: 2
explanation: |
  準天頂衛星は、日本付近の上空に長時間見える軌道を取り、GPSを補完します。ビルの谷間などでも衛星を捕捉しやすくなり、測位の可用性と精度を高められます。

  「アシストGPS」は、アシストGPSは、基地局などから補助情報を得てGPS測位を支援する方式です。
  「ジャイロセンサー」は、ジャイロセンサーは、端末の角速度や向きの変化を測るセンサーです。
  「準天頂衛星」が正しいです。準天頂衛星は日本付近の上空に長く見え、GPS測位を補完します。
  「プローブカー」は、プローブカーは、走行車両から位置や速度などの交通情報を収集する仕組みです。
