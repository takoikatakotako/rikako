# 令和6年度 ITパスポート 公開問題 問93
id: 1073
type: single_choice
text: |
  関係データベースで管理している"従業員"表から、氏名が"%葉_"に該当する従業員を抽出した。抽出された従業員は何名か。ここで、"_"は任意の1文字を表し、"%"は0文字以上の任意の文字列を表すものとする。
  
  従業員表:
  従業員番号 | 氏名
  S001 | 千葉翔
  S002 | 葉山花子
  S003 | 鈴木葉子
  S004 | 佐藤乙葉
  S005 | 秋葉彩葉
  S006 | 稲葉小春
choices:
  - "1"
  - "2"
  - "3"
  - "4"
correct: 1
explanation: |
  「%」は0文字以上の任意の文字列、「_」は任意の1文字を表します。「%葉_」は末尾から2文字目が「葉」の氏名に一致するので、千葉翔と鈴木葉子の2名です。
