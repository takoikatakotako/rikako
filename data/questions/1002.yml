# 令和6年度 ITパスポート 公開問題 問22
id: 1002
type: single_choice
text: |
  インターネットを介して個人や企業が保有する住宅などの遊休資産の貸出しを仲介するサービスや仕組みを表す用語として、最も適切なものはどれか。
choices:
  - "シェアードサービス"
  - "シェアウェア"
  - "シェアリングエコノミー"
  - "ワークシェアリング"
correct: 2
explanation: |
  シェアリングエコノミーは、個人や企業が保有する住宅、車などの遊休資産を、インターネット上の仲介サービスを通じて他者と共有・貸借する仕組みです。

  「シェアードサービス」は、シェアードサービスは、グループ企業の共通業務を一か所へ集約する経営手法です。
  「シェアウェア」は、シェアウェアは、試用後に継続利用の料金を求めるソフトウェアの配布形態です。
  「シェアリングエコノミー」が正しいです。遊休資産をインターネット経由で貸し借りする仕組みです。
  「ワークシェアリング」は、ワークシェアリングは、一つの仕事を複数人で分けて雇用や労働時間を調整する考え方です。
