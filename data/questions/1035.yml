# 令和6年度 ITパスポート 公開問題 問55
id: 1035
type: single_choice
text: |
  システム監査の目的に関する記述として、適切なものはどれか。
choices:
  - "開発すべきシステムの具体的な用途を分析し、システム要件を明らかにすること"
  - "情報システムが設置されている施設とその環境を総合的に企画、管理、活用すること"
  - "情報システムに係るリスクに適切に対応しているかどうかを評価することによって、組織体の目標達成に寄与すること"
  - "知識、スキル、ツール及び技法をプロジェクト活動に適用することによって、プロジェクトの要求事項を満足させること"
correct: 2
explanation: |
  システム監査は、独立した立場から情報システムに関するリスクへの対応状況を評価し、改善を助言することで組織目標の達成に寄与します。

  ア：システムの用途や要件を明らかにするのは要件定義の目的です。
  イ：施設と環境を総合的に管理するのはファシリティマネジメントの目的です。
  ウ：正しいです。リスク対応を独立した立場で評価し、組織目標の達成に寄与します。
  エ：知識や技法を適用して要求事項を満たすのはプロジェクトマネジメントの目的です。
