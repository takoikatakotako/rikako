# 令和6年度 ITパスポート 公開問題 問5
id: 985
type: single_choice
text: |
  ベンチャーキャピタルに関する記述として、適切なものはどれか。
choices:
  - "新しい技術の獲得や、規模の経済性の追求などを目的に、他の企業と共同出資会社を設立する手法"
  - "株式売却による利益獲得などを目的に、新しい製品やサービスを武器に市場へ参入しようとする企業に対して出資などを行う企業"
  - "新サービスや技術革新などの創出を目的に、国や学術機関、他の企業など外部の組織と共創関係を結び、積極的に技術や資源を交換し、自社に取り込む手法"
  - "特定された課題の解決を目的に、一定の期間を設けて企業内に立ち上げられ、構成員を関連部門から招集し、目的が達成された時点で解散する組織"
correct: 1
explanation: |
  ベンチャーキャピタルは、成長が期待される未上場企業などへ出資し、株式公開や株式売却による利益の獲得を目指す投資会社です。共同出資会社の設立や社内の時限的組織そのものを指す言葉ではありません。

  「新しい技術の獲得や、規模の経済性の追求などを目的に、他の企業と共同出資会社を設立する手法」は、他社と共同出資会社を設立するジョイントベンチャーの説明です。
  「株式売却による利益獲得などを目的に、新しい製品やサービスを武器に市場へ参入しようとする企業に対して出資などを行う企業」が正しいです。成長企業へ出資し、株式売却などによる収益を目指します。
  「新サービスや技術革新などの創出を目的に、国や学術機関、他の企業など外部の組織と共創関係を結び、積極的に技術や資源を交換し、自社に取り込む手法」は、外部組織と知識や技術を交換して新たな価値を生むオープンイノベーションの説明です。
  「特定された課題の解決を目的に、一定の期間を設けて企業内に立ち上げられ、構成員を関連部門から招集し、目的が達成された時点で解散する組織」は、特定目的のため期間限定で編成されるプロジェクト組織の説明です。
