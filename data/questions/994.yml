# 令和6年度 ITパスポート 公開問題 問14
id: 994
type: single_choice
text: |
  ある商品の販売量と気温の関係が一次式で近似できるとき、予測した気温から商品の販売量を推定する手法として、適切なものはどれか。
choices:
  - "回帰分析"
  - "線形計画法"
  - "デルファイ法"
  - "パレート分析"
correct: 0
explanation: |
  回帰分析は、ある変数と別の変数の関係を数式で表し、一方の値から他方の値を推定する手法です。気温と販売量を一次式で近似して予測する場合は単回帰分析に当たります。

  「回帰分析」が正しいです。気温を説明変数、販売量を目的変数として一次式で推定します。
  「線形計画法」は、限られた資源や制約の下で目的値を最大化・最小化する手法です。
  「デルファイ法」は、専門家への反復調査によって将来予測の合意を得る手法です。
  「パレート分析」は、項目を重要度や頻度順に並べ、重点的に改善する対象を見つける手法です。
