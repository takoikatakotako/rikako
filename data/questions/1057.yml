# 令和6年度 ITパスポート 公開問題 問77
id: 1057
type: single_choice
text: |
  出所が不明のプログラムファイルの使用を避けるために、その発行元を調べたい。このときに確認する情報として、適切なものはどれか。
choices:
  - "そのプログラムファイルのアクセス権"
  - "そのプログラムファイルの所有者情報"
  - "そのプログラムファイルのデジタル署名"
  - "そのプログラムファイルのハッシュ値"
correct: 2
explanation: |
  デジタル署名を検証すると、ファイルが署名後に改ざんされていないことと、署名に使われた証明書に基づく発行元を確認できます。単なるハッシュ値だけでは発行元を特定できません。

  ア：アクセス権は読取りや実行の許可を示しますが、信頼できる発行元の証明にはなりません。
  イ：ファイルシステム上の所有者情報は変更できるため、発行元の証明にはなりません。
  ウ：正しいです。証明書に基づくデジタル署名を検証すると発行元と改ざんの有無を確認できます。
  エ：ハッシュ値は同一性や改ざん検知に使えますが、それだけでは発行元を証明できません。
