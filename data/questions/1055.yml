# 令和6年度 ITパスポート 公開問題 問75
id: 1055
type: single_choice
text: |
  情報セキュリティの3要素である機密性、完全性及び可用性と、それらを確保するための対策の例a〜cの適切な組合せはどれか。
  
  a アクセス制御
  b デジタル署名
  c ディスクの二重化
choices:
  - "a:可用性, b:完全性, c:機密性"
  - "a:可用性, b:機密性, c:完全性"
  - "a:完全性, b:機密性, c:可用性"
  - "a:機密性, b:完全性, c:可用性"
correct: 3
explanation: |
  アクセス制御は許可された者だけが情報へアクセスできる機密性を確保します。デジタル署名は改ざんを検知して完全性を、ディスクの二重化は障害時も利用を続けられる可用性を高めます。

  ア：アクセス制御は機密性、デジタル署名は完全性、二重化は可用性を高めるため、対応が異なります。
  イ：三つの対策と情報セキュリティ要素の対応がいずれも異なります。
  ウ：アクセス制御は完全性ではなく機密性、デジタル署名は機密性ではなく完全性を高めます。
  エ：正しいです。aは機密性、bは完全性、cは可用性を確保する対策です。
