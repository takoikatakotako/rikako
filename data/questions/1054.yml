# 令和6年度 ITパスポート 公開問題 問74
id: 1054
type: single_choice
text: |
  トランザクション処理に関する記述のうち、適切なものはどれか。
choices:
  - "コミットとは、トランザクションが正常に処理されなかったときに、データベースをトランザクション開始前の状態に戻すことである。"
  - "排他制御とは、トランザクションが正常に処理されたときに、データベースの内容を確定させることである。"
  - "ロールバックとは、複数のトランザクションが同時に同一データを更新しようとしたときに、データの矛盾が起きないようにすることである。"
  - "ログとは、データベースの更新履歴を記録したファイルのことである。"
correct: 3
explanation: |
  ログは、データベースに対して行われた更新の履歴を記録し、障害回復などに利用するファイルです。コミットは更新の確定、ロールバックは開始前への取消し、排他制御は同時更新による矛盾の防止です。

  「コミットとは、トランザクションが正常に処理されなかったときに、データベースをトランザクション開始前の状態に戻すことである。」は、処理失敗時に開始前の状態へ戻す操作はロールバックです。
  「排他制御とは、トランザクションが正常に処理されたときに、データベースの内容を確定させることである。」は、正常終了した更新を確定する操作はコミットです。
  「ロールバックとは、複数のトランザクションが同時に同一データを更新しようとしたときに、データの矛盾が起きないようにすることである。」は、同じデータへの同時更新による矛盾を防ぐ処理は排他制御です。
  「ログとは、データベースの更新履歴を記録したファイルのことである。」が正しいです。ログはデータベースの更新履歴を記録したファイルです。
