# 令和6年度 ITパスポート 公開問題 問58
id: 1038
type: single_choice
text: |
  文書作成ソフトや表計算ソフトなどにおいて、一連の操作手順をあらかじめ定義しておき、実行する機能はどれか。
choices:
  - "オートコンプリート"
  - "ソースコード"
  - "プラグアンドプレイ"
  - "マクロ"
correct: 3
explanation: |
  マクロは、文書作成ソフトや表計算ソフトで繰り返し行う一連の操作をあらかじめ記録・定義し、自動実行する機能です。

  「オートコンプリート」は、オートコンプリートは、入力途中の文字から候補を予測して補完する機能です。
  「ソースコード」は、ソースコードは、プログラミング言語で記述されたプログラムの元となる文です。
  「プラグアンドプレイ」は、プラグアンドプレイは、接続した周辺機器を自動認識・設定する仕組みです。
  「マクロ」が正しいです。一連の操作を定義して自動実行する機能はマクロです。
