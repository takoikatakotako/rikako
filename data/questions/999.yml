# 令和6年度 ITパスポート 公開問題 問19
id: 999
type: single_choice
text: |
  ある銀行では、システムの接続仕様を外部に公開し、あらかじめ契約を結んだ外部事業者のアクセスを認めることによって、利便性の高い、高度なサービスを展開しやすくしている。このような取組を表す用語として、最も適切なものはどれか。
choices:
  - "BPO"
  - "RPA"
  - "オープンAPI"
  - "技術経営"
correct: 2
explanation: |
  オープンAPIは、システムの機能やデータを外部から利用できるよう、接続仕様を公開する取組です。契約した外部事業者とAPI連携することで、新しい金融サービスを提供しやすくなります。
