# 化学基礎 問5
id: 672
type: single_choice
text: |
  塩化ナトリウムのようなイオン結晶の性質として、最も適切なものはどれか。
choices:
  - "固体のままでも、電気をよく通す。"
  - "水に溶かしても、電気を通さない。"
  - "水溶液や融解した状態では、電気を通す。"
  - "非常に低い温度でしか存在できない。"
correct: 2
explanation: |
  この問題は、「イオン結晶がいつ電気を通すか」を考える問題です。

  イオン結晶では、固体のときは陽イオンと陰イオンが決まった位置に並んでいて動けないため、電気をほとんど通しません。しかし、水に溶けたり融解したりすると、イオンが動けるようになります。電圧をかけると、陽イオンは陰極側へ、陰イオンは陽極側へ移動して電荷を運ぶため、電気が流れます。水溶液中では、金属中のように電子が液体の中を移動するのではなく、主にイオンの移動が電流を担っています。したがって、正解は「水溶液や融解した状態では、電気を通す」です。
  
  なお、電極の表面では電子の受け渡しを伴う反応が起こりますが、どの物質が反応するかは水溶液の種類などによって異なります。
  
  「固体のままでも、電気をよく通す」は、イオンが動けないので適切ではありません。
  「水に溶かしても、電気を通さない」は、水溶液ではイオンが動けるので適切ではありません。
  「水溶液や融解した状態では、電気を通す」が正しいです。イオンが自由に動けるようになるためです。
  「非常に低い温度でしか存在できない」は、イオン結晶の性質の説明として適切ではありません。
