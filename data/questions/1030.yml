# 令和6年度 ITパスポート 公開問題 問50
id: 1030
type: single_choice
text: |
  ソフトウェア製品の品質特性を、移植性、機能適合性、互換性、使用性、信頼性、性能効率性、セキュリティ、保守性に分類したとき、RPAソフトウェアの使用性に関する記述として、最も適切なものはどれか。
choices:
  - "RPAが稼働するPCのOSが変わっても動作する。"
  - "RPAで指定した時間及び条件に基づき、適切に自動処理が実行される。"
  - "RPAで操作対象となるアプリケーションソフトがバージョンアップされても、簡単な設定変更で対応できる。"
  - "RPAを利用したことがない人でも、簡単な教育だけで利用可能になる。"
correct: 3
explanation: |
  使用性は、利用者がソフトウェアを理解し、習得し、操作しやすい度合いです。未経験者でも短い教育で利用できることは使用性に該当し、OS変更への対応は移植性、設定変更のしやすさは保守性に関係します。

  「RPAが稼働するPCのOSが変わっても動作する。」は、OSが変わっても動作する性質は移植性に当たります。
  「RPAで指定した時間及び条件に基づき、適切に自動処理が実行される。」は、指定した条件で正しく処理を続ける性質は信頼性に当たります。
  「RPAで操作対象となるアプリケーションソフトがバージョンアップされても、簡単な設定変更で対応できる。」は、対象ソフトの変更へ容易に対応できる性質は保守性に当たります。
  「RPAを利用したことがない人でも、簡単な教育だけで利用可能になる。」が正しいです。未経験者でも容易に学習・利用できることは使用性に当たります。
