# 令和6年度 ITパスポート 公開問題 問51
id: 1031
type: single_choice
text: |
  システム開発プロジェクトにおいて、テスト中に発見された不具合の再発防止のために不具合分析を行うことにした。テスト結果及び不具合の内容を表に記入し、不具合ごとに根本原因を突き止めた後に、根本原因ごとに集計を行い発生頻度の多い順に並べ、主要な根本原因の特定を行った。このとき利用した図表のうち、根本原因を集計し、発生頻度順に並べて棒グラフで示し、累積値を折れ線グラフで重ねて示したものはどれか。
choices:
  - "散布図"
  - "チェックシート"
  - "特性要因図"
  - "パレート図"
correct: 3
explanation: |
  パレート図は、項目を発生頻度の高い順に並べた棒グラフと、その累積比率を示す折れ線グラフを組み合わせた図です。重要な少数の原因を見つけるために使います。

  「散布図」は、散布図は、二つの量を点で表して相関関係を確認する図です。
  「チェックシート」は、チェックシートは、確認項目や発生件数を記録・集計するための表です。
  「特性要因図」は、特性要因図は、結果と原因の関係を魚の骨のような形で整理する図です。
  「パレート図」が正しいです。頻度順の棒グラフと累積値の折れ線を組み合わせるパレート図です。
