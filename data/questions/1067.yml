# 令和6年度 ITパスポート 公開問題 問87
id: 1067
type: single_choice
text: |
  通常の検索エンジンでは検索されず匿名性が高いので、サイバー攻撃や違法商品の取引などにも利用されることがあり、アクセスするには特殊なソフトウェアが必要になることもあるインターネット上のコンテンツの総称を何と呼ぶか。
choices:
  - "RSS"
  - "SEO"
  - "クロスサイトスクリプティング"
  - "ダークウェブ"
correct: 3
explanation: |
  ダークウェブは、通常の検索エンジンには登録されず、専用ソフトウェアなどを使ってアクセスする匿名性の高い領域です。違法取引やサイバー犯罪に悪用される場合があります。
