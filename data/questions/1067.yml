# 令和6年度 ITパスポート 公開問題 問87
id: 1067
type: single_choice
text: |
  通常の検索エンジンでは検索されず匿名性が高いので、サイバー攻撃や違法商品の取引などにも利用されることがあり、アクセスするには特殊なソフトウェアが必要になることもあるインターネット上のコンテンツの総称を何と呼ぶか。
choices:
  - "RSS"
  - "SEO"
  - "クロスサイトスクリプティング"
  - "ダークウェブ"
correct: 3
explanation: |
  ダークウェブは、通常の検索エンジンには登録されず、専用ソフトウェアなどを使ってアクセスする匿名性の高い領域です。違法取引やサイバー犯罪に悪用される場合があります。

  「RSS」は、RSSは、Webサイトの更新情報を配信するための形式です。
  「SEO」は、SEOは、検索結果でWebサイトを上位に表示させるための最適化です。
  「クロスサイトスクリプティング」は、クロスサイトスクリプティングは、Webページへ悪意あるスクリプトを混入させる攻撃です。
  「ダークウェブ」が正しいです。通常の検索で見つからず、専用ソフトが必要な場合もある匿名性の高い領域です。
