# 令和6年度 ITパスポート 公開問題 問82
id: 1062
type: single_choice
text: |
  ISMSクラウドセキュリティ認証に関する記述として、適切なものはどれか。
choices:
  - "一度認証するだけで、複数のクラウドサービスやシステムなどを利用できるようにする認証の仕組み"
  - "クラウドサービスについて、クラウドサービス固有の管理策が実施されていることを認証する制度"
  - "個人情報について適切な保護措置を講ずる体制を整備しているクラウド事業者などを評価して、事業活動に関してプライバシーマークの使用を認める制度"
  - "利用者がクラウドサービスへログインするときの環境、IPアドレスなどに基づいて状況を分析し、リスクが高いと判断された場合に追加の認証を行う仕組み"
correct: 1
explanation: |
  ISMSクラウドセキュリティ認証は、ISMSを基礎に、クラウドサービス固有の情報セキュリティ管理策が適切に実施されていることを認証する制度です。シングルサインオンやリスクベース認証の方式そのものではありません。

  「一度認証するだけで、複数のクラウドサービスやシステムなどを利用できるようにする認証の仕組み」は、一度の認証で複数サービスを利用する仕組みはシングルサインオンです。
  「クラウドサービスについて、クラウドサービス固有の管理策が実施されていることを認証する制度」が正しいです。クラウドサービス固有のセキュリティ管理策の実施を認証します。
  「個人情報について適切な保護措置を講ずる体制を整備しているクラウド事業者などを評価して、事業活動に関してプライバシーマークの使用を認める制度」は、個人情報保護体制を評価してマーク使用を認める制度はプライバシーマーク制度です。
  「利用者がクラウドサービスへログインするときの環境、IPアドレスなどに基づいて状況を分析し、リスクが高いと判断された場合に追加の認証を行う仕組み」は、状況のリスクに応じて追加認証する仕組みはリスクベース認証です。
