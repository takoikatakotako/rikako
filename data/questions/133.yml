# 令和7年度 ITパスポート 公開問題 問45
id: 133
type: single_choice
text: |
  計画時の予算が2,000万円で、40日間で100本のプログラムを作成するプロジェクトがある。プロジェクトが20日経過した時点で全体の40%である40本のプログラムが完成し、1,000万円のコストが掛かった。プロジェクトの指標を次の評価式で算出する場合、プロジェクトの指標として適切な組合せはどれか。ここで、各プログラムの作成に必要な日数及びコストは全て同一で、プロジェクト期間中は常に同じ量の作業が実施されるものとする。

  ［評価式］
  スケジュール（%）：
  （完成したプログラム本数÷評価時点での完成見込みプログラム本数）×100
  コスト（%）：
  （完成したプログラムに掛かったコスト÷完成したプログラム分として計画したコスト）×100
choices:
  - "スケジュール（%）80、コスト（%）125"
  - "スケジュール（%）80、コスト（%）100"
  - "スケジュール（%）90、コスト（%）125"
  - "スケジュール（%）90、コスト（%）100"
correct: 0
explanation: |
  20日経過した時点は40日間の半分なので、計画どおりなら100本の半分の50本が完成している見込みです。実際の完成は40本なので、スケジュールは 40÷50×100＝80% です。完成した40本分として計画したコストは 2,000万円×40÷100＝800万円で、実際には1,000万円掛かったので、コストは 1,000÷800×100＝125% です。

  「スケジュール（%）80、コスト（%）125」が正しいです。進捗は計画の80%にとどまり、掛かったコストは計画の125%です。
  「スケジュール（%）80、コスト（%）100」は、コストが計画どおりという意味になりますが、実際は800万円の計画に対し1,000万円掛かっています。
  「スケジュール（%）90、コスト（%）125」は、スケジュールの計算で完成見込みを50本ではなく約44本とした場合の値であり、評価式に合いません。
  「スケジュール（%）90、コスト（%）100」は、スケジュール・コストのどちらも実績と合いません。
