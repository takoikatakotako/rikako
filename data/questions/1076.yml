# 令和6年度 ITパスポート 公開問題 問96
id: 1076
type: single_choice
text: |
  Aさんは次のように宛先を指定して電子メールを送信した。この電子メールの受信者に関する記述のうち、適切なものだけを全て挙げたものはどれか。
  
  〔宛先〕
  To: Bさんのメールアドレス
  Cc: Cさんのメールアドレス
  Bcc: Dさんのメールアドレス、Eさんのメールアドレス
  
  (1) CさんはDさんのメールアドレスを知ることができる。
  (2) DさんはCさんのメールアドレスを知ることができる。
  (3) EさんはDさんのメールアドレスを知ることができる。
choices:
  - "(1)"
  - "(1), (3)"
  - "(2)"
  - "(2), (3)"
correct: 2
explanation: |
  ToとCcの宛先は受信者全員から確認できますが、Bccの宛先は他の受信者には表示されません。DさんはCcのCさんを確認できますが、CさんはDさんを、Eさんは同じBccのDさんを確認できないため、正しいのは(2)だけです。

  「(1)」は、CさんからBccのDさんは見えないため、(1)は誤りです。
  「(1), (3)」は、(1)と(3)はいずれもBcc受信者が他の受信者に見えるとしており、誤りです。
  「(2)」が正しいです。DさんからToとCcは見えるのでCさんを確認できます。
  「(2), (3)」は、Eさんから同じBccのDさんは見えないため、(3)を含む組合せは誤りです。
