# 令和6年度 ITパスポート 公開問題 問34
id: 1014
type: single_choice
text: |
  顧客の特徴に応じたきめ細かい対応を行うことによって、顧客と長期的に良好な関係を築き、顧客満足度の向上や取引関係の継続につなげる仕組みを構築したい。その仕組みの構成要素の一つとして、営業活動で入手した顧客に関する属性情報や顧客との交渉履歴などを蓄積し、社内で共有できるシステムを導入することにした。この目的を達成できるシステムとして、最も適切なものはどれか。
choices:
  - "CAEシステム"
  - "MRPシステム"
  - "SCMシステム"
  - "SFAシステム"
correct: 3
explanation: |
  SFA（Sales Force Automation）は、顧客属性、商談履歴、営業活動などを蓄積・共有して営業を支援するシステムです。これらの情報を活用することで、顧客ごとの継続的な関係づくりに役立ちます。

  「CAEシステム」は、CAEは、設計や製造工程をコンピュータ上で解析・シミュレーションするシステムです。
  「MRPシステム」は、MRPは、生産計画に基づいて必要な資材の量と時期を計画するシステムです。
  「SCMシステム」は、SCMは、調達から生産・物流・販売までの供給連鎖を最適化する仕組みです。
  「SFAシステム」が正しいです。SFAは顧客情報や商談履歴を共有して営業活動を支援します。
