# 平成29年度春期 ITパスポート 問53
id: 100
type: single_choice
text: |
  プロジェクトにおけるスコープとは、プロジェクトの成果物及び成果物を作成するために行わなければならない作業のことである。あるシステム開発プロジェクトにおいて、システム要件定義、設計、プログラミング、テストを実施する。a〜cのうち、このプロジェクトのスコープに含まれるものとして、適切なものだけを全て挙げたものはどれか。

  a　開発するシステムやその設計書
  b　テスト完了後の本番稼働時における保守作業
  c　プロジェクトメンバ育成計画の作成や実施
choices:
  - "a"
  - "a, c"
  - "b, c"
  - "c"
correct: 1
explanation: |
  スコープは、プロジェクトの成果物と、その成果物を作るために実施しなければならない作業を指します。aの開発するシステムや設計書は成果物そのもの、cのメンバ育成計画の作成や実施はプロジェクトを進めるために行う作業なので、どちらもスコープに含まれます。bの本番稼働時における保守作業はプロジェクト完了後の運用であり、このプロジェクトのスコープには含まれません。

  「a」は、成果物だけを挙げており、cの作業が抜けています。
  「a, c」が正しいです。成果物と、それを作るために実施する作業の両方が含まれます。
  「b, c」は、bがプロジェクト完了後の保守作業なので含まれません。
  「c」は、成果物であるaが抜けています。
