# 令和6年度 ITパスポート 公開問題 問10
id: 990
type: single_choice
text: |
  不正競争防止法で規定されている限定提供データに関する記述として、最も適切なものはどれか。
choices:
  - "特定の第三者に対し、1回に限定して提供する前提で保管されている技術上又は営業上の情報は限定提供データである。"
  - "特定の第三者に提供する情報として電磁的方法によって相当量蓄積され管理されている技術又は営業上の情報（秘密として管理されているものを除く）は限定提供データである。"
  - "特定の第三者に提供するために、金庫などで物理的に管理されている技術上又は営業上の情報は限定提供データである。"
  - "不正競争防止法に定めのある営業秘密は限定提供データである。"
correct: 1
explanation: |
  限定提供データは、特定の者に提供するため、電磁的方法で相当量蓄積・管理された技術上又は営業上の情報です。秘密として管理される営業秘密は、限定提供データの定義から除かれます。

  「特定の第三者に対し、1回に限定して提供する前提で保管されている技術上又は営業上の情報は限定提供データである。」は、提供回数が1回というだけでは、限定提供データの要件を満たしません。
  「特定の第三者に提供する情報として電磁的方法によって相当量蓄積され管理されている技術又は営業上の情報（秘密として管理されているものを除く）は限定提供データである。」が正しいです。限定提供データの蓄積・管理・提供方法の要件を満たしています。
  「特定の第三者に提供するために、金庫などで物理的に管理されている技術上又は営業上の情報は限定提供データである。」は、限定提供データは電磁的方法で蓄積・管理された情報であり、金庫での物理管理だけでは該当しません。
  「不正競争防止法に定めのある営業秘密は限定提供データである。」は、営業秘密として秘密管理される情報は、限定提供データの定義から除外されます。
