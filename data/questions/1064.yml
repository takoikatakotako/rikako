# 令和6年度 ITパスポート 公開問題 問84
id: 1064
type: single_choice
text: |
  IoTエリアネットワークでも利用され、IoTデバイスからの無線通信をほかのIoTデバイスが中継することを繰り返し、リレー方式で通信をすることによって、広範囲の通信を実現する技術はどれか。
choices:
  - "GPS"
  - "MIMO"
  - "キャリアアグリゲーション"
  - "マルチホップ"
correct: 3
explanation: |
  マルチホップは、各IoTデバイスが隣接するデバイスへデータを順次中継する通信方式です。一つの電波が届く距離を超えて、メッシュ状に広い範囲をカバーできます。

  「GPS」は、GPSは衛星からの電波を使って位置を測定する仕組みです。
  「MIMO」は、MIMOは複数のアンテナを使って通信速度や品質を高める技術です。
  「キャリアアグリゲーション」は、キャリアアグリゲーションは複数の周波数帯を束ねて通信速度を高める技術です。
  「マルチホップ」が正しいです。端末が通信を順次中継して広い範囲へ届ける方式です。
