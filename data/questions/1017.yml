# 令和6年度 ITパスポート 公開問題 問37
id: 1017
type: single_choice
text: |
  システム開発プロジェクトを終結する時に、プロジェクト統合マネジメントで実施する活動として、最も適切なものはどれか。
choices:
  - "工程の進捗の予定と実績の差異を分析する。"
  - "作成した全ての成果物の一覧を確認する。"
  - "総費用の予算と実績の差異を分析する。"
  - "知識や教訓を組織の資産として登録する。"
correct: 3
explanation: |
  プロジェクトの終結時には、成果や経験を振り返り、得られた知識や教訓を組織の資産として保存します。進捗や費用の差異分析は、主にプロジェクト実行中の監視・コントロールで行う活動です。

  「工程の進捗の予定と実績の差異を分析する。」は、進捗の予定・実績差異は、プロジェクト実行中のスケジュール監視で分析します。
  「作成した全ての成果物の一覧を確認する。」は、成果物一覧の確認だけでは、統合マネジメントにおける終結活動を十分に表していません。
  「総費用の予算と実績の差異を分析する。」は、予算・実績差異は、プロジェクト実行中のコスト監視で分析します。
  「知識や教訓を組織の資産として登録する。」が正しいです。終結時には得られた知識や教訓を組織の資産として残します。
