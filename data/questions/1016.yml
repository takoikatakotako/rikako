# 令和6年度 ITパスポート 公開問題 問36
id: 1016
type: single_choice
text: |
  プロジェクトに該当する事例として、適切なものだけを全て挙げたものはどれか。
  
  a 会社合併に伴う新組織への移行
  b 社内システムの問合せや不具合を受け付けるサービスデスクの運用
  c 新規の経理システム導入に向けたプログラム開発
  d 毎年度末に実施する会計処理
choices:
  - "a, c"
  - "b, c"
  - "b, d"
  - "c"
correct: 0
explanation: |
  プロジェクトは、独自の成果物を生み出すための期限付きの活動です。会社合併に伴う移行と新規システム開発は一時的な活動なので該当し、サービスデスク運用や毎年の会計処理は継続・反復する定常業務です。

  「a, c」が正しいです。aとcは終了条件と独自の成果がある一時的な活動です。
  「b, c」は、bのサービスデスク運用は継続業務なので、プロジェクトには該当しません。
  「b, d」は、bとdはいずれも繰り返し行う定常業務です。
  「c」は、cは該当しますが、会社合併に伴う移行であるaもプロジェクトです。
