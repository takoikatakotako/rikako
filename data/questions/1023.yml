# 令和6年度 ITパスポート 公開問題 問43
id: 1023
type: single_choice
text: |
  情報システムに関する施設や設備を維持・保全するために行うリスク対策のうち、ファシリティマネジメントの観点から行う対策として、適切なものだけを全て挙げたものはどれか。
  
  a コンピュータ室への入室を、認可した者だけに限定する。
  b コンピュータの設置場所を示す標識を掲示しない。
  c 利用者のPCにマルウェア対策ソフトを導入する。
choices:
  - "a"
  - "a, b"
  - "a, c"
  - "b, c"
correct: 1
explanation: |
  ファシリティマネジメントは、建物や設備など物理的環境を管理する活動です。入室制限と、重要設備の設置場所を外部から分かりにくくする対策は該当しますが、PCへのマルウェア対策ソフト導入は技術的対策です。
