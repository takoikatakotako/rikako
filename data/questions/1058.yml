# 令和6年度 ITパスポート 公開問題 問78
id: 1058
type: single_choice
text: |
  利用者がスマートスピーカーに向けて話し掛けた内容に対して、スマートスピーカーから音声で応答するための処理手順が(1)〜(4)のとおりであるとき、音声認識に該当する処理はどれか。
  
  (1) 利用者の音声をテキストデータに変換する。
  (2) テキストデータを解析して、その意味を理解する。
  (3) 応答する内容を決定して、テキストデータを生成する。
  (4) 生成したテキストデータを読み上げる。
choices:
  - "(1)"
  - "(2)"
  - "(3)"
  - "(4)"
correct: 0
explanation: |
  音声認識は、人が発した音声を解析して文字列へ変換する処理です。(2)は自然言語理解、(3)は応答生成、(4)は音声合成に当たります。

  「(1)」が正しいです。音声をテキストへ変換する処理が音声認識です。
  「(2)」は、テキストの意味を解析する処理は自然言語理解です。
  「(3)」は、応答内容を決めて文章を作る処理は応答生成です。
  「(4)」は、テキストを読み上げる処理は音声合成です。
