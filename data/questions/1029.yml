# 令和6年度 ITパスポート 公開問題 問49
id: 1029
type: single_choice
text: |
  ソフトウェア開発プロジェクトにおける、コストの見積手法には、積み上げ法、ファンクションポイント法、類推見積法などがある。見積りで使用した手法とその特徴に関する記述a〜cの適切な組合せはどれか。
  
  a プロジェクトに必要な個々の作業を洗い出し、その作業ごとの工数を見積もって集計する。
  b プロジェクトの初期段階で使用する手法で、過去の事例を活用してコストを見積もる。
  c データ入出力や機能に着目して、ソフトウェア規模を見積もり、係数を乗ずるなどしてコストを見積もる。
choices:
  - "a:積み上げ法, b:類推見積法, c:ファンクションポイント法"
  - "a:積み上げ法, b:ファンクションポイント法, c:類推見積法"
  - "a:類推見積法, b:積み上げ法, c:ファンクションポイント法"
  - "a:類推見積法, b:ファンクションポイント法, c:積み上げ法"
correct: 0
explanation: |
  aは作業ごとの工数を合計する積み上げ法、bは過去の類似案件を基にする類推見積法、cは入出力や機能から規模を測るファンクションポイント法です。

  「a:積み上げ法, b:類推見積法, c:ファンクションポイント法」が正しいです。aは積み上げ法、bは類推見積法、cはファンクションポイント法です。
  「a:積み上げ法, b:ファンクションポイント法, c:類推見積法」は、bとcが逆です。過去事例を使うのは類推見積法です。
  「a:類推見積法, b:積み上げ法, c:ファンクションポイント法」は、aとbが逆です。個々の作業工数を集計するのは積み上げ法です。
  「a:類推見積法, b:ファンクションポイント法, c:積み上げ法」は、a・b・cのいずれの対応も説明と一致しません。
