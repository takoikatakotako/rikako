# 令和6年度 ITパスポート 公開問題 問53
id: 1033
type: single_choice
text: |
  ITガバナンスに関する次の記述中のaに入れる字句として、最も適切なものはどれか。
  
  経営者は、aの事業の目的を支援する観点で、効果的、効率的かつ受容可能なaのITの利用について評価する。
choices:
  - "過去と現在"
  - "現在"
  - "現在と将来"
  - "将来"
correct: 2
explanation: |
  ITガバナンスでは、経営者が現在と将来の事業目的を支援する観点から、現在と将来のIT利用を評価し、方向付け、モニタリングします。

  「過去と現在」は、ITガバナンスは将来も見据えるため、過去と現在だけでは範囲が不足します。
  「現在」は、現在のIT利用だけでなく、将来のIT利用も評価対象です。
  「現在と将来」が正しいです。現在と将来の事業目的を支える現在と将来のIT利用を評価します。
  「将来」は、将来だけでなく、現在のIT利用も評価対象です。
