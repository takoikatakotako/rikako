name: Plan Data Sync

on:
  pull_request:
    # data の差分だけでなく、datasync バイナリに影響する変更でも走らせる。
    # 接続先（SSM パラメータ名）やドライバ設定を変えたとき、この PR 上で dev への
    # 実接続を確認できるようにするため（Issue #367）。
    # ワークフローファイル自身も含める（含めないと、ここを直した PR で発火しない）。
    paths:
      - "data/**"
      - "app/cmd/datasync/**"
      - "app/internal/datasync/**"
      - "app/internal/dbconn/**"
      - "app/go.mod"
      - "app/go.sum"
      - ".github/workflows/plan-datasync.yml"

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  plan:
    name: datasync plan (dev)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Build datasync
        working-directory: app
        run: go build -o datasync ./cmd/datasync

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::197865631794:role/rikako-development-github-actions
          aws-region: ap-northeast-1

      - name: Run datasync plan
        id: plan
        working-directory: app
        run: |
          set -o pipefail
          # pipefail でパイプ内の datasync の失敗を検知する（tee で出力はCIログにも残す）
          ./datasync -data ../data -env dev plan 2>&1 | tee datasync-plan-full.txt
          # 1行目は接続先URL（DB接続文字列）を含むため除外してコメント用に書き出す
          tail -n +2 datasync-plan-full.txt > ../datasync-plan.txt

      - name: Comment on PR
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const stripAnsi = (text) =>
              text
                .replace(/\u001B\[[0-?]*[ -/]*[@-~]/g, '')
                .replace(/\u001B\][^\u0007]*(?:\u0007|\u001B\\)/g, '');
            const full = stripAnsi(fs.readFileSync('datasync-plan.txt', 'utf8')).trim();
            const maxLen = 60000;
            const result = full.length > maxLen
              ? `${full.slice(0, maxLen)}\n\n...truncated (${full.length - maxLen} chars omitted). See workflow logs for full output.`
              : full;

            const body = `### 📋 Data Sync Plan (dev)

            \`\`\`
            ${result}
            \`\`\`

            > \`data/\` の変更による DB 差分です。反映するには \`datasync apply\` を手動実行してください。
            `;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Data Sync Plan')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
