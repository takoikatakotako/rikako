name: Deploy Android Prod

# Play Console へ AAB を上げる。手動起動＋ environment: production の承認を通す
# （Deploy Web Prod / Apply Terraform Prod と同じ方式）。
#
# 署名素材（アップロード鍵の keystore・パスワード・alias、Play のサービスアカウント JSON）と
# Firebase の google-services.json は GitHub Secrets ではなく prod アカウントの SSM から取る
# （OIDC で assume、#405 / #235）。手元の初回手動アップロードも同じスクリプトで同じ場所から取る:
#   scripts/android-signing.sh pull / pull-service-account、scripts/firebase-config.sh pull prod android
# SSM から取った値は GitHub Actions が自動でマスクしないので、ログに出さないよう
# 変数に入れるだけにし、ファイルは $RUNNER_TEMP に置く。
#
# 新規アプリは Play Console の仕様上、最初の1本だけ手動アップロードが要る。
# 詳細は docs/android.md の「Play Console へのデプロイ」を参照。
on:
  workflow_dispatch:
    inputs:
      flavor:
        description: どのアプリを上げるか
        required: true
        type: choice
        options:
          - chemistry
          - itPassport
      track:
        description: 配信トラック
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      status:
        description: リリース状態（draft にすると Play Console で手動公開）
        required: true
        default: draft
        type: choice
        options:
          - draft
          - completed

permissions:
  contents: read
  id-token: write # SSM から Firebase 設定を取るための OIDC

concurrency:
  group: deploy-android-prod-${{ inputs.flavor }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.flavor }} (${{ inputs.track }})
    # main の内容だけを上げる。ブランチから起動しても job ごと skip する。
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production # ← required reviewers による承認ゲート

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure AWS credentials (SSM)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::211125415945:role/rikako-production-github-actions
          aws-region: ap-northeast-1

      # keystore を $RUNNER_TEMP に復元し、パスワード類を GITHUB_ENV へ（マスクしてから）。
      - name: Fetch signing material from SSM
        run: |
          set -euo pipefail
          eval "$(scripts/android-signing.sh pull "$RUNNER_TEMP")"
          for v in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            echo "::add-mask::${!v}"
            echo "${v}=${!v}" >> "$GITHUB_ENV"
          done
          echo "ANDROID_KEYSTORE_FILE=${ANDROID_KEYSTORE_FILE}" >> "$GITHUB_ENV"
          scripts/android-signing.sh pull-service-account "$RUNNER_TEMP/play-service-account.json"

      # google-services.json は git 管理外なので SSM から取る。取れなければ（パラメータ未登録・
      # 権限不足）スクリプトが失敗して止まる。Crashlytics 無しの AAB が黙って上がるのを防ぐため。
      - name: Fetch google-services.json from SSM
        run: scripts/firebase-config.sh pull prod android

      # 手動初回（versionCode 1）と分ける。同じ flavor は concurrency で直列化し、
      # 過去の run を後から再実行しても新しい番号になるよう UTC 時刻を使う。
      - name: Set unique version code
        run: |
          # 2020-01-01 UTC からの秒数。2026年時点で約2億なので Play の上限内。
          VERSION_CODE=$(($(date -u +%s) - 1577836800))
          if [ "$VERSION_CODE" -le 1 ] || [ "$VERSION_CODE" -gt 2100000000 ]; then
            echo "versionCode が Play Console の有効範囲外です" >&2
            exit 1
          fi
          echo "ANDROID_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      # 署名用の環境変数は上の step で GITHUB_ENV に入れてある。
      - name: Build AAB
        working-directory: ./android
        run: |
          FLAVOR="${{ inputs.flavor }}"
          VARIANT="$(echo "${FLAVOR:0:1}" | tr '[:lower:]' '[:upper:]')${FLAVOR:1}ProdRelease"
          ./gradlew --no-daemon ":app:bundle${VARIANT}"

      - name: Upload to Play Console
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ runner.temp }}/play-service-account.json
          packageName: ${{ inputs.flavor == 'chemistry' && 'org.rikako.chemistry' || 'org.rikako.itpassport' }}
          releaseFiles: android/app/build/outputs/bundle/${{ inputs.flavor }}ProdRelease/*.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}

      # 何を上げたか後から辿れるようにしておく（Play Console 側の版番号と突き合わせる用）。
      - name: Summary
        run: |
          {
            echo "### Android アップロード"
            echo ""
            echo "- flavor: ${{ inputs.flavor }}"
            echo "- track: ${{ inputs.track }} (${{ inputs.status }})"
            echo "- versionCode: $ANDROID_VERSION_CODE"
            echo "- commit: ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"
