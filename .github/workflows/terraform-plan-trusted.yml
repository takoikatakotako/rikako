name: Terraform Plan (trusted)

# PR の terraform plan を実行する「信頼済み」ワークフロー（Issue #370）。
#
# plan は PR に書かれた HCL をそのまま評価するため、AWS 認証情報を渡す前に
# 「誰の PR か」を確かめる必要がある。その判定を PR 側のファイルに置くと、PR 自身が
# 判定を書き換えられてしまうので、**main に置いたこのファイルからしか plan 用ロールを
# assume できない**ようにしてある（IAM 側で job_workflow_ref を突き合わせる）。
#
# 呼び出し側（plan-terraform.yml）は必ず @main で参照すること。ref を変えると
# job_workflow_ref が一致せず、認証情報は発行されない。
on:
  workflow_call:
    inputs:
      environment:
        description: 対象環境の表示名（tfcmt のラベルに使う）
        required: true
        type: string
      working_directory:
        description: terraform を実行するディレクトリ
        required: true
        type: string
      role_arn:
        description: assume する plan 用ロール
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  plan:
    name: Plan (${{ inputs.environment }})
    runs-on: ubuntu-latest
    # PR の作成者がオーナー本人のときだけ実行する。
    # actor（run を開始したアカウント）ではなく PR の作成者を見るのは、他人の PR を
    # オーナーが reopen / re-run したときに、その PR のコードへ認証情報が渡らないようにするため。
    if: github.event.pull_request.user.login == github.repository_owner
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14"
          terraform_wrapper: false

      - name: Setup tfcmt
        uses: shmokmt/actions-setup-tfcmt@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: ap-northeast-1

      - name: Terraform Init
        run: terraform init -input=false

      # plan 用ロールは ReadOnlyAccess なので S3 のロックオブジェクトを書けない。
      # prod の apply-terraform-prod.yml の plan ステップと同じく -lock=false で実行する。
      - name: Terraform Plan
        run: |
          tfcmt -var "target:${{ inputs.environment }}" plan -patch -- terraform plan -input=false -lock=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
