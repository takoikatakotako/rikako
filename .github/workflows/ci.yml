name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: rikako
          POSTGRES_PASSWORD: password
          POSTGRES_DB: rikako
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('app/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run migrations
        run: |
          docker run --rm -v $(pwd)/migrations:/migrations \
            --network host \
            migrate/migrate -path=/migrations \
            -database "postgres://rikako:password@localhost:5432/rikako?sslmode=disable" up

      - name: Build server
        working-directory: ./app
        run: go build -v ./cmd/server

      - name: Build importer
        working-directory: ./app
        run: go build -v ./cmd/importer

      - name: Run importer
        working-directory: ./app
        env:
          DATABASE_URL: postgres://rikako:password@localhost:5432/rikako?sslmode=disable
        run: go run ./cmd/importer -data ../data

      - name: Verify data import
        run: |
          docker run --rm --network host postgres:18 \
            psql "postgres://rikako:password@localhost:5432/rikako?sslmode=disable" \
            -c "SELECT COUNT(*) FROM questions;" \
            -c "SELECT COUNT(*) FROM images;" \
            -c "SELECT COUNT(*) FROM workbooks;"

      - name: Run tests
        working-directory: ./app
        env:
          DATABASE_URL: postgres://rikako:password@localhost:5432/rikako?sslmode=disable
          IMAGE_BASE_URL: https://example.com
        run: go test -v -count=1 ./...

  # openapi.yaml の先頭セグメントを API Gateway の route_keys に足し忘れると、
  # そのパスがアクセスログ上でスキャン（routeKey=$default）と区別できなくなる。
  api-routes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check API Gateway route coverage
        run: python3 scripts/check-api-routes.py

      # web/ は IT と化学で同じコードを共有しているため、片方のワークフローにだけ
      # 環境変数を足す抜けが起きる。ビルドも lint も通ってしまい、デプロイして
      # 初めて壊れが分かるので CI で止める。
      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      # ガード自体が退行すると守れていないことに気づけないので、先にテストする。
      - name: Test guard scripts
        run: python3 -m unittest discover -s scripts/tests

      - name: Check frontend deploy env
        run: python3 scripts/check-frontend-env.py
