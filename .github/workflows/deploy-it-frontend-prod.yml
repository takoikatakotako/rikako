name: Deploy IT Frontend Prod

# 本番（it.rikako.org）は自動デプロイしない。内容を更新したいときに手動実行する。
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-1
  S3_BUCKET: rikako-it-production
  CF_ALIAS: it.rikako.org

jobs:
  build-and-deploy:
    name: Build and Deploy IT Frontend (prod)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: npm run build
        env:
          NEXT_PUBLIC_SITE: it
          NEXT_PUBLIC_CONTENT_BASE_URL: https://content.rikako.org/v1
          NEXT_PUBLIC_API_BASE_URL: https://api.rikako.org
          NEXT_PUBLIC_COGNITO_REGION: ap-northeast-1
          NEXT_PUBLIC_COGNITO_CLIENT_ID: 4sqsett62vuckqt68d72nf2083

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::211125415945:role/rikako-production-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        working-directory: web
        run: |
          # まず全ファイルを同期し stale を削除する。--delete が html も対象になるよう
          # 除外を付けない（除外すると stale な html/xml が消えず公開され続ける）。
          # ここでは全ファイルに must-revalidate を設定。
          aws s3 sync out/ s3://${{ env.S3_BUCKET }}/ \
            --delete \
            --cache-control "public, max-age=0, must-revalidate"
          # ハッシュ付きアセット（html/txt/xml 以外）だけ長期 immutable に上書き（削除なし）。
          aws s3 sync out/ s3://${{ env.S3_BUCKET }}/ \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "*.txt" \
            --exclude "*.xml"

      - name: Invalidate CloudFront cache
        run: |
          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?contains(Aliases.Items, '${{ env.CF_ALIAS }}')].Id | [0]" \
            --output text)
          if [ -z "$DIST_ID" ] || [ "$DIST_ID" = "None" ]; then
            echo "CloudFront distribution for ${{ env.CF_ALIAS }} not found (terraform 未適用?)"
            exit 1
          fi
          echo "Invalidating $DIST_ID"
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"

      - name: Print summary
        run: |
          echo "## IT Frontend Deploy Complete (prod) 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://${{ env.CF_ALIAS }}/" >> $GITHUB_STEP_SUMMARY
