name: Apply Terraform Prod

# prod の terraform を手動適用する（Issue #240）。
# 流れ: plan（ゲート無し）→ GitHub Environment `production` の承認 → apply。
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    name: Plan (prod)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/environments/prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14"
          terraform_wrapper: false

      - name: Configure AWS credentials (read-only)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::211125415945:role/rikako-production-github-actions-terraform-plan
          aws-region: ap-northeast-1

      - name: Terraform Init
        run: terraform init -input=false

      # 承認前のレビュー用。public リポのため plan の秘匿値は terraform の
      # sensitive 伝播で (sensitive value) に伏字化される。バイナリ plan は保存・公開しない。
      - name: Terraform Plan
        run: |
          set -o pipefail
          terraform plan -input=false -lock=false -no-color 2>&1 | tee /tmp/plan.txt

      # plan を run ページの Summary に出す。承認画面（同じ run ページ）から
      # ログを開かずに差分を確認できる。出力は上の plan と同じ -no-color テキストで、
      # 秘匿値は terraform の sensitive 伝播で伏字化済み。GITHUB_STEP_SUMMARY の
      # 上限(1MiB)対策で先頭のみに丸める。
      - name: Publish plan to summary
        if: always()
        run: |
          {
            echo "## Terraform Plan (prod)"
            echo ""
            echo "<details><summary>plan output</summary>"
            echo ""
            echo '```terraform'
            head -c 900000 /tmp/plan.txt
            echo ''
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Apply (prod)
    needs: plan
    runs-on: ubuntu-latest
    environment: production # ← required reviewers による承認ゲート
    defaults:
      run:
        working-directory: terraform/environments/prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14"
          terraform_wrapper: false

      - name: Configure AWS credentials (admin)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::211125415945:role/rikako-production-github-actions-terraform-apply
          aws-region: ap-northeast-1

      - name: Terraform Init
        run: terraform init -input=false

      # 承認後に再 plan して適用する（バイナリ plan を跨がせない = public リポでの秘匿値漏洩回避）。
      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve
