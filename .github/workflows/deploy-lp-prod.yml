name: Deploy LP Prod

# LP は prod アカウントから rikako.org を直接配信している（dev が無い）。
# main へのマージで即公開されると差し戻しが効かないため、他の prod 反映と同じく
# 手動起動 + environment: production の承認を通す。
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-1
  S3_BUCKET: rikako-lp
  CLOUDFRONT_DISTRIBUTION_ID: "E22QZR2IQ4IB95"

jobs:
  deploy:
    name: Deploy LP to S3
    runs-on: ubuntu-latest
    environment: production # ← required reviewers による承認ゲート
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::211125415945:role/rikako-production-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        run: |
          set -euo pipefail
          # aws s3 sync は「ローカルの方が新しい/サイズが違う」ファイルしか転送しない。
          # 全同期してから後で cache-control を上書きしようとしても、2本目は
          # スキップされて効かない。そのため **未アップロードのうちに** それぞれの
          # cache-control で入れる（アセット先、HTML 後）。
          #
          # --delete は除外したパターンには効かないので、両方の pass に付けて
          # それぞれの担当分の stale を消す。片方に付けないと、その種類の
          # 消したファイルが公開され続ける。
          aws s3 sync lp/ s3://${{ env.S3_BUCKET }}/ \
            --delete \
            --exclude "*.html" \
            --cache-control "public, max-age=86400"
          # HTML は毎回取り直させる。--exclude "*" を先に置かないと全ファイルが
          # 対象のままになる（--include だけでは絞り込めない）。
          aws s3 sync lp/ s3://${{ env.S3_BUCKET }}/ \
            --delete \
            --exclude "*" \
            --include "*.html" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Print summary
        run: |
          echo "## LP Deploy Complete! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://rikako.org" >> $GITHUB_STEP_SUMMARY
          echo "**S3 Bucket:** ${{ env.S3_BUCKET }}" >> $GITHUB_STEP_SUMMARY
