name: Plan Terraform

# PR で dev の terraform plan を出す。
#
# 実処理は main に置いた terraform-plan-trusted.yml に委譲する（Issue #370）。
# plan は PR に書かれた HCL をそのまま評価するため、AWS 認証情報を渡してよいかの判定を
# PR 側のファイルに置くと、PR 自身が判定を書き換えられてしまう。呼び出し先を @main に
# 固定し、IAM 側でも job_workflow_ref で同じファイルに束縛してある。
on:
  pull_request:
    paths:
      - "terraform/**"

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  plan:
    # ref は必ず @main のままにすること。別の ref に変えると job_workflow_ref が
    # IAM の信頼ポリシーと一致せず、認証情報が発行されない。
    uses: takoikatakotako/rikako/.github/workflows/terraform-plan-trusted.yml@main
    with:
      environment: dev
      working_directory: terraform/environments/dev
      role_arn: arn:aws:iam::197865631794:role/rikako-development-github-actions-terraform-plan
