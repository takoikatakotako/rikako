name: Run Database Migration (Dev)

on:
  workflow_dispatch:
    inputs:
      direction:
        description: 'Migration direction'
        required: true
        default: 'up'
        type: choice
        options:
          - up
          - down
      steps:
        description: 'Number of steps (leave empty for all)'
        required: false
        type: string
  # deploy-api-dev.yml が Lambda 更新の前に呼ぶ（新しいコードが要求するテーブルを先に作る、#408）。
  # 未適用の migration が無ければ "no change" で終わる。
  workflow_call:
    inputs:
      direction:
        required: false
        default: 'up'
        type: string
      steps:
        required: false
        default: ''
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-1

jobs:
  migrate:
    name: Run Migration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::197865631794:role/rikako-development-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.0
          terraform_wrapper: false

      - name: Get database connection string
        id: db-config
        working-directory: terraform/environments/dev
        run: |
          # Neon の API キーは versions.tf が SSM から読む。output は state を読むだけなので provider 認証は不要。
          terraform init
          CONNECTION_STRING=$(terraform output -raw connection_string)
          echo "connection-string=${CONNECTION_STRING}" >> $GITHUB_OUTPUT
          echo "::add-mask::${CONNECTION_STRING}"

      - name: Run migration
        run: |
          MIGRATION_COMMAND="${{ inputs.direction }}"

          if [ -n "${{ inputs.steps }}" ]; then
            MIGRATION_COMMAND="${MIGRATION_COMMAND} ${{ inputs.steps }}"
          fi

          echo "Running migration: ${MIGRATION_COMMAND}"

          docker run --rm -v $(pwd)/migrations:/migrations \
            migrate/migrate -path=/migrations \
            -database "${{ steps.db-config.outputs.connection-string }}" \
            ${MIGRATION_COMMAND}

      - name: Migration summary
        if: always()
        run: |
          echo "## Migration Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** dev" >> $GITHUB_STEP_SUMMARY
          echo "**Direction:** ${{ inputs.direction }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ inputs.steps }}" ]; then
            echo "**Steps:** ${{ inputs.steps }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Steps:** All" >> $GITHUB_STEP_SUMMARY
          fi
