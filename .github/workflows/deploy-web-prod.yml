name: Deploy Web Prod

# it / chemistry は web/ という 1 つのコードベースを NEXT_PUBLIC_SITE で切り替えて
# ビルドしている。したがってデプロイ単位も 1 つにまとめ、両サイトを一緒に出す。
#
# 本番は自動で出さない。手動で起動し、**environment: production の承認**を通してから
# 反映する（Terraform の Apply Terraform Prod と同じ方式）。
on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: "ロールバック用。戻したい commit の 40 桁 SHA（main 履歴上のもののみ。未指定なら起動した ref の HEAD）"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-web-prod
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1

jobs:
  deploy:
    name: Deploy ${{ matrix.site }} (prod)
    runs-on: ubuntu-latest
    environment: production # ← required reviewers による承認ゲート
    strategy:
      # 片方が失敗しても、もう片方は出し切る（両方の結果を見てから対処したい）。
      fail-fast: false
      matrix:
        include:
          - site: it
            bucket: rikako-it-production
            alias: it.rikako.org
          - site: chemistry
            bucket: rikako-chemistry-production
            alias: chemistry.rikako.org

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # ワークフロー定義は起動した ref（= main）のものを使いつつ、
          # ビルド対象のコードだけ過去の commit に戻せるようにする。
          # --ref に古い SHA は渡せない（branch/tag のみ）ため、この形にしている。
          ref: ${{ inputs.checkout_ref || github.sha }}
          # 下の祖先チェックに main の履歴が要る。
          fetch-depth: 0

      # checkout 自体はコードを実行しないので、依存インストール（npm ci の
      # lifecycle script）より前にここで弾く。これが無いと、任意の branch を
      # 指定するだけで、この job の権限（prod は environment: production と
      # id-token: write）で未マージのコードを実行できてしまう。
      - name: Validate checkout ref
        env:
          # expression を run に直書きするとシェル入力になるため env 経由で渡す。
          CHECKOUT_REF: ${{ inputs.checkout_ref || github.sha }}
          # 明示指定されたか（= ロールバックか）を区別するために生の入力も見る。
          CHECKOUT_REF_INPUT: ${{ inputs.checkout_ref }}
        run: |
          set -euo pipefail
          if [[ ! "$CHECKOUT_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "checkout_ref は 40 桁の commit SHA のみ指定できます: $CHECKOUT_REF"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$CHECKOUT_REF" origin/main; then
            echo "checkout_ref が main の履歴上にありません: $CHECKOUT_REF"
            exit 1
          fi

          # ロールバック時は「実際に本番へ出したことがある commit」だけを許可する。
          # main 履歴上でも未デプロイの commit は動作実績が無く、障害対応で
          # 戻すつもりが未検証のコードを出すことになりかねない。
          # 実績は deploy 成功時に打つ web-prod/* タグで表す。
          if [ -n "$CHECKOUT_REF_INPUT" ]; then
            git fetch --tags --quiet origin
            if [ -z "$(git tag --points-at "$CHECKOUT_REF" -l 'web-prod/*')" ]; then
              echo "::error::$CHECKOUT_REF には web-prod/* タグがありません（本番へ出した実績が無い commit です）。"
              echo "ロールバック候補は次で確認できます: git tag -l 'web-prod/*' --sort=-refname"
              exit 1
            fi
          fi

          echo "checkout_ref OK: $CHECKOUT_REF"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: npm run build
        env:
          NEXT_PUBLIC_SITE: ${{ matrix.site }}
          NEXT_PUBLIC_CONTENT_BASE_URL: https://content.rikako.org/v1
          NEXT_PUBLIC_API_BASE_URL: https://api.rikako.org
          NEXT_PUBLIC_COGNITO_REGION: ap-northeast-1
          NEXT_PUBLIC_COGNITO_CLIENT_ID: 4sqsett62vuckqt68d72nf2083
          # GA4。rikako.org 配下は 1 ストリームで測定するため lp と同じ測定ID。
          # dev のデプロイでは渡さない（未設定ならタグを出さない）。
          NEXT_PUBLIC_GA_MEASUREMENT_ID: G-G3C92B498N

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::211125415945:role/rikako-production-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        working-directory: web
        run: |
          set -euo pipefail
          # aws s3 sync は「ローカルの方が新しい/サイズが違う」ファイルしか転送しない。
          # 全同期してから cache-control を上書きしようとしても、2本目はスキップされて
          # 効かない（#336）。そのため対象を重ならないように分け、それぞれ最初から
          # 目的の cache-control で入れる。--delete も両方に付けて各自の stale を消す。
          #
          # immutable にしてよいのは _next/static/ のみ。Next.js がハッシュ名で出力する
          # ため内容が変われば URL も変わる。public/ の画像などはハッシュが付かないので、
          # 1年 immutable にすると更新が届かなくなる。
          aws s3 sync out/ s3://${{ matrix.bucket }}/ \
            --delete \
            --exclude "_next/static/*" \
            --cache-control "public, max-age=0, must-revalidate"
          aws s3 sync out/ s3://${{ matrix.bucket }}/ \
            --delete \
            --exclude "*" \
            --include "_next/static/*" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Invalidate CloudFront cache
        run: |
          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?contains(Aliases.Items, '${{ matrix.alias }}')].Id | [0]" \
            --output text)
          if [ -z "$DIST_ID" ] || [ "$DIST_ID" = "None" ]; then
            echo "CloudFront distribution for ${{ matrix.alias }} not found (terraform 未適用?)"
            exit 1
          fi
          echo "Invalidating $DIST_ID"
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"

      - name: Print summary
        env:
          CHECKOUT_REF: ${{ inputs.checkout_ref || github.sha }}
        run: |
          echo "## ${{ matrix.site }} Deploy Complete (prod) 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://${{ matrix.alias }}/" >> $GITHUB_STEP_SUMMARY
          echo "**Ref:** \`$CHECKOUT_REF\`" >> $GITHUB_STEP_SUMMARY

  # 両サイトが成功したときだけタグを打つ。matrix は fail-fast: false なので、
  # 片方だけ成功した実行に印を付けると「両サイトがこの commit で揃っている」
  # ことを保証できない。needs は全 leg の成功を待つ。
  release-note:
    needs: [deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # 実際に配信した commit にタグを打つ（ロールバック時は過去の commit）。
          ref: ${{ inputs.checkout_ref || github.sha }}
          fetch-depth: 0
      - name: Create deploy release note
        uses: ./.github/actions/deploy-release-note
        with:
          tag-prefix: web-prod
          title: "Web Prod"
          github-token: ${{ github.token }}
