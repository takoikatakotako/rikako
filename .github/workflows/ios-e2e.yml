name: iOS E2E

# メールログイン（#283）の E2E。dev バックエンドに実際につないで、
# 匿名 → アカウントのマージと、新しい端末での復元を検証する。
#
# 実バックエンドに依存するため、ネットワークや dev 環境の状態で落ちることがある。
# その場合はアプリ側の回帰と切り分けたうえで再実行すること。
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-e2e.yml'
  workflow_dispatch:

# dev の共有テストユーザーを使うため、**全 PR をまたいで直列化**する。
# このテストは「アカウントの回答数 baseline → +1」を検証するので、
# 2つの run が同じ baseline を読んでから双方がマージすると +2 になり、
# 実装が正しくても片方が落ちる。
#
# ref ごとの group にすると別 PR 同士が並走してしまうため、共有資源名を
# group にする。cancel-in-progress は false（cancel するとチェックが
# cancelled になるので、待たせる方を選ぶ）。
concurrency:
  group: ios-account-e2e-shared-user
  cancel-in-progress: false

jobs:
  e2e:
    # public リポジトリなので fork からの pull_request には Secrets が渡らない。
    # 認証情報が無いまま実行すると iOS と無関係な PR まで必ず red になるため、
    # 同一リポジトリの PR と手動実行に限る。
    #
    # pull_request_target で fork のコードに Secrets を渡す方式は、
    # スクリプトを書き換えれば認証情報を持ち出せるため使わない。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run account link E2E
        working-directory: ./ios
        env:
          RIKAKO_E2E_EMAIL: ${{ secrets.RIKAKO_E2E_EMAIL }}
          RIKAKO_E2E_PASSWORD: ${{ secrets.RIKAKO_E2E_PASSWORD }}
        run: ./scripts/run-account-e2e.sh

      # 失敗時の画面を含む xcresult を回収する（CI でしか出ない事象の調査用）。
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-e2e-xcresult
          path: ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
          retention-days: 7
          if-no-files-found: warn
