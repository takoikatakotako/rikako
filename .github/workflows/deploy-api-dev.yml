name: Deploy API Dev

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: read # 同じコミットの Apply Terraform Dev の完了を待つため

# 連続マージで 2 本同時に走ると Lambda の UpdateFunctionCode が ResourceConflictException で
# 落ちる（2026-09-21 に #411 / #412 の連続マージで発生）。直列化して後の run に譲る。
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  ENVIRONMENT: dev

# 順序: migration → Terraform apply（あれば）→ Lambda 更新（#408 のレビューで確定）。
# 新しいコードが要求するテーブルや IAM 権限が先に無いと、更新直後の Lambda が
# 既存エンドポイントごと 500 / AccessDenied になる。prod は手動なので runbook に同じ順序を明記。
jobs:
  # 未適用の migration を先に当てる（無ければ no change）。
  migrate:
    name: Migrate (dev)
    uses: ./.github/workflows/migrate-dev.yml
    with:
      direction: up

  # 同じコミットで Apply Terraform Dev が走っていれば完了を待つ（無ければ即通過）。
  # terraform/ の変更が無い push では Apply Terraform Dev 自体が起動しない。
  wait-terraform:
    name: Wait for Apply Terraform Dev
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the same-commit Terraform apply
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # 起動直後だと run がまだ登録されていないことがあるので少し待ってから探す
          sleep 20
          for i in $(seq 1 60); do
            RUNS=$(gh run list --repo "$REPO" --workflow=apply-terraform-dev.yml --commit "$SHA"               --json status,conclusion,databaseId --jq '.[] | "\(.databaseId) \(.status) \(.conclusion)"')
            if [ -z "$RUNS" ]; then
              echo "このコミットの Apply Terraform Dev は無い（terraform/ の変更なし）。続行します"
              exit 0
            fi
            echo "$RUNS"
            if ! echo "$RUNS" | grep -qvE ' completed '; then
              if echo "$RUNS" | grep -qE ' completed (failure|cancelled|timed_out)'; then
                echo "::error::Apply Terraform Dev が失敗しています。IAM 等が揃わないため API のデプロイを止めます"
                exit 1
              fi
              echo "Apply Terraform Dev 完了。続行します"
              exit 0
            fi
            sleep 30
          done
          echo "::error::Apply Terraform Dev の完了を 30 分待ちましたが終わりません"
          exit 1

  build-and-push:
    name: Build and Push Docker Image
    needs: [migrate, wait-terraform]
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS credentials (ECR push)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::579039992557:role/rikako-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries: "579039992557"

      - name: Extract metadata for Docker
        id: meta
        run: |
          ECR_REGISTRY=579039992557.dkr.ecr.ap-northeast-1.amazonaws.com
          ECR_REPOSITORY=rikako-api
          IMAGE_TAG=${{ env.ENVIRONMENT }}
          echo "tags=${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "Image tag: ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

      - name: Build and push Docker image
        run: |
          docker build -f app/Dockerfile.lambda -t ${{ steps.meta.outputs.tags }} .
          docker push ${{ steps.meta.outputs.tags }}

      - name: Configure AWS credentials (deploy)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::197865631794:role/rikako-development-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Update Lambda function
        env:
          FUNCTION_NAME: rikako-api-development
        run: |
          # シークレット系の env は全て ssm:... リテラル経由（internal/secrets.Resolve が起動時に解決）
          # のため、デフォルト JSON 出力でも実値が露出することはない。
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --image-uri "${{ steps.meta.outputs.tags }}" \
            --publish

          echo "Waiting for function update to complete..."
          aws lambda wait function-updated \
            --function-name "$FUNCTION_NAME"

      - name: Smoke tests
        env:
          API_URL: https://api.dev.rikako.org
          CONTENT_URL: https://content.dev.rikako.org
        run: |
          FAILED=0

          check_endpoint() {
            local name="$1"
            local url="$2"
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$url")
            if [ "$STATUS" = "200" ]; then
              echo "✅ $name (HTTP $STATUS)"
            else
              echo "❌ $name (HTTP $STATUS)"
              FAILED=1
            fi
          }

          echo "Running smoke tests..."
          check_endpoint "Public API /health" "${API_URL}/health"
          check_endpoint "Content CDN workbooks.json" "${CONTENT_URL}/v1/workbooks.json"
          check_endpoint "Content CDN categories.json" "${CONTENT_URL}/v1/categories.json"

          if [ "$FAILED" -eq 1 ]; then
            echo "::error::Smoke tests failed"
            exit 1
          fi
          echo "All smoke tests passed"

      - name: Print summary
        run: |
          echo "## Deploy Complete! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ env.ENVIRONMENT }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tag:** \`${{ steps.meta.outputs.tags }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Lambda Function:** rikako-api-development" >> $GITHUB_STEP_SUMMARY
