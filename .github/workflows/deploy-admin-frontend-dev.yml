name: Deploy Admin Frontend Dev

on:
  push:
    branches:
      - main
    paths:
      - "admin/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-1
  S3_BUCKET: rikako-admin-development
  CLOUDFRONT_DISTRIBUTION_ID: "EIA13UUJ41NKO"

jobs:
  build-and-deploy:
    name: Build and Deploy Admin Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        working-directory: admin
        run: npm ci

      - name: Build
        working-directory: admin
        run: npm run build
        env:
          NEXT_PUBLIC_APP_ENV: development

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::197865631794:role/rikako-development-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        working-directory: admin
        run: |
          set -euo pipefail
          # Cache-Control は CloudFront の ResponseHeadersPolicy で付ける
          # （terraform/environments/*/frontend_cache.tf）。sync は転送するファイルを
          # 選ぶだけなので、ここで 2 本に分けているのは --delete の適用範囲のためだけ。
          #
          # 1) ハッシュ名付きチャンクを先に公開する。--delete を付けないので、デプロイ前から
          #    開いている画面が参照する旧チャンクも残る（#342）。
          aws s3 sync out/_next/static/ s3://${{ env.S3_BUCKET }}/_next/static/
          # 2) HTML 等を同期し、こちらだけ stale を削除する。旧チャンクは削除対象から外す。
          aws s3 sync out/ s3://${{ env.S3_BUCKET }}/ --delete --exclude "_next/static/*"

      - name: Invalidate CloudFront cache
        if: env.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Print summary
        run: |
          echo "## Admin Frontend Deploy Complete! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**S3 Bucket:** ${{ env.S3_BUCKET }}" >> $GITHUB_STEP_SUMMARY
