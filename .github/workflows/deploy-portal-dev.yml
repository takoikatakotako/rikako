name: Deploy Portal Dev

on:
  push:
    branches:
      - main
    paths:
      - "portal/**"
      - ".github/workflows/deploy-portal-dev.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-1
  S3_BUCKET: rikako-portal-development
  CF_ALIAS: account.dev.rikako.org

jobs:
  build-and-deploy:
    name: Build and Deploy Portal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: portal/package-lock.json

      - name: Install dependencies
        working-directory: portal
        run: npm ci

      - name: Build
        working-directory: portal
        run: npm run build
        env:
          # いずれも公開値（ビルド成果物に含まれる）。dev の App Client ID。
          NEXT_PUBLIC_COGNITO_REGION: ap-northeast-1
          NEXT_PUBLIC_COGNITO_CLIENT_ID: 2buo6t5fbneujoknvrdph8flda
          NEXT_PUBLIC_API_BASE_URL: https://api.dev.rikako.org
          NEXT_PUBLIC_PORTAL_URL: https://account.dev.rikako.org

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::197865631794:role/rikako-development-github-actions
          aws-region: ${{ env.AWS_REGION }}

      # インフラは Apply Terraform Dev が並行作成するため、S3 バケットと CloudFront
      # distribution が揃うまで上限付きで待つ（初回マージの race を吸収）。
      - name: Wait for infrastructure
        run: |
          echo "Waiting for S3 bucket ${S3_BUCKET} ..."
          for i in $(seq 1 60); do
            if aws s3api head-bucket --bucket "${S3_BUCKET}" 2>/dev/null; then
              echo "bucket ready"; break
            fi
            if [ "$i" = "60" ]; then echo "bucket not ready (timeout 10m)"; exit 1; fi
            sleep 10
          done
          echo "Waiting for CloudFront distribution for ${CF_ALIAS} ..."
          for i in $(seq 1 60); do
            DIST_ID=$(aws cloudfront list-distributions \
              --query "DistributionList.Items[?contains(Aliases.Items, '${CF_ALIAS}')].Id | [0]" \
              --output text 2>/dev/null)
            if [ -n "$DIST_ID" ] && [ "$DIST_ID" != "None" ]; then
              echo "distribution ready: $DIST_ID"
              echo "DIST_ID=$DIST_ID" >> "$GITHUB_ENV"
              break
            fi
            if [ "$i" = "60" ]; then echo "distribution not ready (timeout 10m)"; exit 1; fi
            sleep 10
          done

      - name: Deploy to S3
        working-directory: portal
        run: |
          # content-hash 付きの _next/static 以外を同期（stale 削除・毎回検証）。
          # _next/static は除外し削除対象からも外す（下で別途 immutable 同期）。
          aws s3 sync out/ s3://${S3_BUCKET}/ \
            --delete \
            --exclude "_next/static/*" \
            --cache-control "public, max-age=0, must-revalidate"
          # content-hash 付きアセットのみ長期 immutable（不変なので stale 削除はしない）。
          aws s3 sync out/_next/static/ s3://${S3_BUCKET}/_next/static/ \
            --cache-control "public, max-age=31536000, immutable"

      - name: Invalidate CloudFront cache
        run: |
          echo "Invalidating ${DIST_ID}"
          aws cloudfront create-invalidation --distribution-id "${DIST_ID}" --paths "/*"

      - name: Print summary
        run: |
          echo "## Portal Deploy Complete 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://${{ env.CF_ALIAS }}/" >> $GITHUB_STEP_SUMMARY
