name: Deploy release note
description: 前回デプロイタグ以降にマージされた PR をまとめた GitHub Release を作成する

inputs:
  tag-prefix:
    description: "タグ接頭辞（例: api-prod）。コンポーネント別に分けること（PR範囲がずれるため）"
    required: true
  title:
    description: "Release タイトル接頭辞（例: API Prod）"
    required: true
  github-token:
    description: "GitHub token（contents: write 権限が必要）"
    required: true

runs:
  using: composite
  steps:
    - name: Create deploy release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PREFIX: ${{ inputs.tag-prefix }}
        TITLE: ${{ inputs.title }}
      run: |
        set -euo pipefail
        # 同じ prefix の前回タグを起点にする（他コンポーネントのタグと混ざらない）。
        # タグ名に日時が埋まっているため refname 降順＝時系列で最新を取る
        # （軽量タグは creatordate がコミット日に依存し、同一コミットで曖昧になるため）。
        PREV=$(git tag -l "${PREFIX}/*" --sort=-refname | head -1)

        # デプロイ記録（タグ）は毎回作る。「最後にいつ・どの commit を出したか」を
        # 表すものなので、ロールバックや同一コミットの再デプロイでも更新が要る。
        # ここを飛ばすと、過去コミットへ戻したあとも最新タグが戻す前を指し続ける。
        # タグ・リリースの日時は JST（運用が日本時間のため）。
        TAG="${PREFIX}/$(TZ=Asia/Tokyo date +%Y%m%d-%H%M%S)"
        git tag "$TAG"
        git push origin "$TAG"

        # 一方 Release は「前回から何が入ったか」を伝えるものなので、前タグから
        # 新規コミットが無いとき（変更なし再デプロイ・過去への戻し）は作らない。
        if [ -n "$PREV" ] && [ "$(git rev-list "${PREV}..HEAD" --count)" -eq 0 ]; then
          echo "前回デプロイ($PREV)から新しいコミットが無いため Release 作成をスキップします（デプロイ記録 $TAG は作成済み）。"
          exit 0
        fi

        if [ -n "$PREV" ]; then
          gh release create "$TAG" \
            --title "${TITLE} ${TAG}" \
            --notes-start-tag "$PREV" \
            --generate-notes
        else
          # 初回は前タグが無いため全履歴を拾わないよう固定文にする。
          gh release create "$TAG" \
            --title "${TITLE} ${TAG}" \
            --notes "初回のデプロイ記録です。次回以降はこのタグ以降のマージ PR を自動でまとめます。"
        fi
