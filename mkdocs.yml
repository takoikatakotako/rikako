site_name: Rikako
site_description: 問題集アプリ ドキュメント
site_url: https://docs.rikako.org/

theme:
  name: material
  language: ja
  palette:
    primary: indigo
    accent: indigo

# 個別のテーブルページは tbls が schema/README.md からリンクするため、nav には概要だけ置く。
# テーブルを増やすたびに nav を直す必要が無いようにしている。
nav:
  - Home: index.md
  - 設計:
      - アーキテクチャ: architecture.md
      - 問題形式仕様書: question-types.md
      - メールログイン設計: email-login-design.md
      - 管理API設計: admin-api.md
      - 管理画面: admin-frontend.md
      - iOSアプリ: ios.md
  - APIリファレンス:
      - 公開API: api/index.html
      - 管理API (Swagger): admin-api/index.html
  - 開発:
      - AWS CLI セットアップ: aws-setup.md
      - データ同期 (datasync): datasync.md
      - sqlc（DBクエリ生成）: sqlc.md
  - 運用:
      - 運用ランブック: runbook.md
      - DBバックアップとリストア: db-backup.md
      - 負荷テスト計画: load-test.md
  - DBスキーマ: schema/README.md
  - プライバシーポリシー: privacy.md

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
